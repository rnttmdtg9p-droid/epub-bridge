name: Cancel obsolete BB production runs

on:
  push:
    paths:
      - ".github/workflows/bb-cancel-obsolete-sharded.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded stalled runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for run_id in 35000731554 35006641733; do
            status="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .status)"
            if [ "$status" != "completed" ]; then
              gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel"
            fi
          done
