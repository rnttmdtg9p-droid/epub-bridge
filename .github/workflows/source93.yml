name: BB remaining93 source acquisition
on:
  push:
    branches: ['bb-source93-20260906']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install HTML acquisition dependencies
        run: python -m pip install --quiet requests==2.32.4 beautifulsoup4==4.13.4
      - name: Retrieve Italian source candidates and bibliographic evidence for all 93 titles
        run: python acquire93.py
      - name: Upload acquired source files and full per-title status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-remaining93-source-candidates
          path: output/
          compression-level: 6
          retention-days: 14
          if-no-files-found: error
