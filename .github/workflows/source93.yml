name: BB source93 acquisition probes
on:
  push:
    branches: ['bb-source93-20260906']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Acquire complete Canti source and discovery indexes
        shell: bash
        run: |
          mkdir -p output/probes output/sources
          python - <<'PY'
          import urllib.request, urllib.error, json, pathlib, hashlib, concurrent.futures
          root=pathlib.Path('output')
          targets=[
          ('sources/Canti_55236_repository.tar.gz','https://codeload.github.com/GITenberg/I-Canti_55236/tar.gz/refs/heads/master'),
          ('sources/55236-0.txt','https://raw.githubusercontent.com/GITenberg/I-Canti_55236/master/55236-0.txt'),
          ('sources/Canti_metadata.yaml','https://raw.githubusercontent.com/GITenberg/I-Canti_55236/master/metadata.yaml'),
          ('probes/pg_catalog.csv','https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv'),
          ('probes/liberliber_mattia_search.html','https://liberliber.it/?s=Il+fu+Mattia+Pascal'),
          ('probes/liberliber_api.json','https://liberliber.it/wp-json/wp/v2/search?search=Il%20fu%20Mattia%20Pascal&per_page=20'),
          ('probes/wikisource_mattia.html','https://it.wikisource.org/wiki/Il_fu_Mattia_Pascal'),
          ('probes/wikisource_mattia_api.json','https://it.wikisource.org/w/api.php?action=parse&page=Il_fu_Mattia_Pascal&prop=text%7Clinks%7Crevid&format=json'),
          ('probes/biblioteca_tree.json','https://api.github.com/repos/linhd-postdata/biblioteca_italiana/git/trees/master?recursive=1'),
          ('probes/biblioteca_readme.md','https://raw.githubusercontent.com/linhd-postdata/biblioteca_italiana/master/README.md'),
          ]
          def get(item):
            name,url=item
            result={'path':name,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBaySourceAcquisition/1.0 (public-domain text research)'})
              with urllib.request.urlopen(req,timeout=45) as r:
                data=r.read(100000001)
                if len(data)>100000000: raise ValueError('safety size limit exceeded')
                result.update(http_status=r.status,final_url=r.url,content_type=r.headers.get('Content-Type'),bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              result['status']='SAVED'
              if name.endswith('55236-0.txt'):
                result['git_blob_sha1']=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                result['expected_git_blob_sha1']='dfb37267b45cf909276d3cbdd59e8144eff6c7ac'
                result['hash_match']=result['git_blob_sha1']==result['expected_git_blob_sha1']
            except Exception as e: result.update(status='FAILED',error=str(e))
            print(json.dumps(result,ensure_ascii=False),flush=True)
            return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
            results=list(ex.map(get,targets))
          (root/'acquisition_log.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload source and discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-source93-probes
          path: output/
          compression-level: 6
          retention-days: 14
          if-no-files-found: error
