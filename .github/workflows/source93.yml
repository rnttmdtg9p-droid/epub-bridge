name: BB remaining93 published source downloads
on:
  push:
    branches: ['bb-source93-20260906']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install --quiet beautifulsoup4==4.13.4
      - name: Acquire through published book-page download links with request spacing
        run: python acquire_ll93.py
      - name: Preserve exact acquisition code
        if: always()
        run: |
          mkdir -p output/code
          cp acquire_ll93.py roster.json output/code/
      - name: Upload immutable source candidates and progress ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-remaining93-liberliber-sources
          path: output/
          compression-level: 6
          retention-days: 14
          if-no-files-found: error
