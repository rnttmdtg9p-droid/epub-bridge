name: BB Russian43 rail caption source scope repair
on:
  push:
    paths: ['.github/workflows/bb-ru43-rail-caption.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Correct and independently compare concise caption
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 scripts/bb_ru43_rail_caption.py
      - name: Preserve actual exchanges
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru43-rail-caption-source-comparison-v5070
          path: results/ru43-rail-caption/
          retention-days: 90
          if-no-files-found: error
