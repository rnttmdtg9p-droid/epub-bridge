name: BB Russian rank85 initial Claude translation
on:
  push:
    paths: ['.github/workflows/bb-ru85-claude.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bb-russian-sequential-rank85
  cancel-in-progress: false
jobs:
  initial-translation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Configure durable source-aligned checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -m py_compile scripts/bb_ru85_claude.py
      - name: Claude initial translation only; independent review remains foreground
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 scripts/bb_ru85_claude.py
      - name: Preserve raw provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru85-claude
          path: results/ru85-claude/
          retention-days: 90
          if-no-files-found: warn

