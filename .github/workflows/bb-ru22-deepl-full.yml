name: BB Russian 22 DeepL complete translation
on:
  push:
    paths:
      - '.github/workflows/bb-ru22-deepl-full.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bb-ru22-deepl-full
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install lxml
      - name: Translate complete verified original
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        run: python3 scripts/bb_ru22_deepl.py
      - name: Save translation checkpoint
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ru22-deepl/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save Russian Monte Cristo DeepL translation checkpoint"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ru22-deepl-checkpoint
          path: results/ru22-deepl/
          retention-days: 30
