name: Fetch Remaining Italian Illustrations

on:
  push:
    paths:
      - '.github/workflows/fetch-remaining-illustrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - book: L_amore_che_torna
            picks: >-
              [["amore_01","File:Boldini Marthe de Florian.jpg","plate"],["amore_02","File:Boldini - Ava Lister, Baroness Ribblesdale (The Black Sash).jpg","plate"],["amore_03","File:Boldini - lady-with-flowers.jpg","plate"],["amore_04","File:Boldini - Lady Nanne Schrader.jpg","plate"],["amore_05","File:Boldini - La signorina Concha de Ossa, 1888.jpg","plate"]]
          - book: Vecchie_storie_d_amore
            picks: >-
              [["vecchie_01","File:Francesco Hayez Romeo and Juliet.jpg","plate"],["vecchie_02","File:Hayez, Francesco – Accusa segreta – 1847 1848.jpg","plate"],["vecchie_03","File:Hayez - Il bacio, dopo 1859.jpg","plate"],["vecchie_04","File:Francisco Hayez - Vengeance is Sworn.jpg","plate"],["vecchie_05","File:Francesco Hayez - Meditation on the History of Italy - WGA11216.jpg","plate"],["vecchie_author","File:Albertazzi - Top, 1922 (page 7 crop).jpg","candidate_author"]]
          - book: Damiano
            picks: >-
              [["damiano_01","File:Induno Domenico (Italian, 1815-1878) «Pane e lacrime» 1855.jpg","plate"],["damiano_02","File:Motherhood (1862-63), by Domenico Induno.jpg","plate"],["damiano_03","File:Milanese life scene in an interior (19th century), by Domenico Induno.jpg","plate"],["damiano_04","File:Domenico Induno - Il rosario, 1850 - Olio su tela.JPG","plate"],["damiano_05","File:The letter (1869), by Domenico Induno.jpg","plate"],["damiano_author","File:Giulio Carcano foto.jpg","author"]]
          - book: Fino_a_Dogali
            picks: >-
              [["dogali_01","File:Don Giovanni Verità.jpg","plate"],["dogali_02","File:Concordia - Via Emilia.jpg","plate"],["dogali_03","File:Portrait of Niccolò Machiavelli by Santi di Tito.jpg","plate"],["dogali_04","File:Bataille de Dogali.jpg","plate"],["dogali_05","File:Gli italiani in Africa Il combattimento di Dogali.jpg","plate"],["dogali_06","File:Il combattimento di Dogali Gli ultimi superstiti.jpg","plate"],["dogali_author","File:Alfredo Oriani.jpg","author"]]
    runs-on: ubuntu-latest
    env:
      BOOK: ${{ matrix.book }}
      PICKS: ${{ matrix.picks }}
    steps:
      - name: Acquire public-domain Commons plates as JPG
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow requests
          mkdir -p "artwork/$BOOK"
          cat > /tmp/fetch_art.py <<'PY'
          import json, re, hashlib, requests, time, os
          from pathlib import Path
          from PIL import Image, ImageOps
          from io import BytesIO

          API='https://commons.wikimedia.org/w/api.php'
          UA='BoundaryBayClassics/1.0 public-domain source acquisition'
          S=requests.Session(); S.headers.update({'User-Agent':UA,'Accept':'*/*'})
          book=os.environ['BOOK']; picks=json.loads(os.environ['PICKS'])

          def api_get(params):
              for attempt in range(8):
                  r=S.get(API,params=params,timeout=90)
                  if r.status_code==429:
                      time.sleep(5*(attempt+1)); continue
                  r.raise_for_status(); return r.json()
              raise RuntimeError('Commons API rate limit persisted')

          def get_file(title):
              p={'action':'query','format':'json','formatversion':2,'redirects':1,'prop':'imageinfo',
                 'iiprop':'url|size|mime|extmetadata','iiurlwidth':1600,'titles':title}
              j=api_get(p); page=j['query']['pages'][0]
              if not page.get('missing'):
                  return page,page.get('imageinfo',[{}])[0]
              p={'action':'query','format':'json','formatversion':2,'generator':'search',
                 'gsrsearch':title.replace('File:',''),'gsrnamespace':6,'gsrlimit':8,'prop':'imageinfo',
                 'iiprop':'url|size|mime|extmetadata','iiurlwidth':1600}
              j=api_get(p); pages=j.get('query',{}).get('pages',[])
              if not pages: return None
              pages.sort(key=lambda x:x.get('imageinfo',[{}])[0].get('width',0)*x.get('imageinfo',[{}])[0].get('height',0),reverse=True)
              return pages[0],pages[0].get('imageinfo',[{}])[0]

          def clean_meta(m):
              out={}
              for k,v in (m or {}).items():
                  val=v.get('value') if isinstance(v,dict) else v
                  if isinstance(val,str):
                      val=re.sub('<[^>]+>',' ',val); val=re.sub(r'\s+',' ',val).strip()
                  out[k]=val
              return out

          def fetch_bytes(url):
              url=url.split('?',1)[0]
              for attempt in range(8):
                  r=S.get(url,timeout=180)
                  if r.status_code==429:
                      w=10*(attempt+1); print('429 wait',w); time.sleep(w); continue
                  if r.status_code in (502,503,504):
                      time.sleep(5*(attempt+1)); continue
                  r.raise_for_status(); return r.content,url
              raise RuntimeError('download retries exhausted')

          records=[]; failures=[]
          for slug,title,role in picks:
              try:
                  got=get_file(title)
                  if not got: raise RuntimeError('not found')
                  page,ii=got
                  # Prefer a 1600px Commons thumbnail to reduce transfer pressure; this is still derived from the archival original.
                  url=ii.get('thumburl') or ii.get('url')
                  raw,url=fetch_bytes(url); rawsha=hashlib.sha256(raw).hexdigest()
                  im=ImageOps.exif_transpose(Image.open(BytesIO(raw)))
                  if im.mode not in ('RGB','L'):
                      if 'A' in im.getbands():
                          bg=Image.new('RGB',im.size,'white'); bg.paste(im,mask=im.getchannel('A')); im=bg
                      else: im=im.convert('RGB')
                  elif im.mode=='L': im=im.convert('RGB')
                  if max(im.size)>1800:
                      s=1800/max(im.size); im=im.resize((round(im.width*s),round(im.height*s)),Image.Resampling.LANCZOS)
                  out=Path('artwork')/book/f'{slug}.jpg'
                  im.save(out,'JPEG',quality=87,optimize=True,progressive=True,subsampling='4:2:0')
                  meta=clean_meta(ii.get('extmetadata')); normsha=hashlib.sha256(out.read_bytes()).hexdigest()
                  rec={'slug':slug,'requested_title':title,'resolved_title':page.get('title'),'book':book,'role':role,
                       'commons_page':'https://commons.wikimedia.org/wiki/'+page.get('title','').replace(' ','_'),
                       'archival_original_url':(ii.get('url') or '').split('?',1)[0],'acquired_url':url,
                       'original_width':ii.get('width'),'original_height':ii.get('height'),'mime':ii.get('mime'),
                       'acquired_sha256':rawsha,'normalized_file':str(out),'normalized_width':im.width,'normalized_height':im.height,
                       'normalized_sha256':normsha,'artist':meta.get('Artist'),'date_time_original':meta.get('DateTimeOriginal'),
                       'credit':meta.get('Credit'),'license_short_name':meta.get('LicenseShortName'),'license_url':meta.get('LicenseUrl'),
                       'usage_terms':meta.get('UsageTerms'),'copyrighted':meta.get('Copyrighted'),'attribution':meta.get('Attribution'),
                       'description':meta.get('ImageDescription')}
                  records.append(rec)
                  print('OK',slug,page.get('title'),im.size,meta.get('LicenseShortName'))
              except Exception as e:
                  failures.append({'slug':slug,'requested_title':title,'book':book,'role':role,'reason':str(e)})
                  print('FAIL',slug,e)
              time.sleep(5)

          root=Path('artwork')/book
          (root/'metadata.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['normalized_sha256']}  {Path(r['normalized_file']).name}\n" for r in records),encoding='utf-8')
          n=sum(1 for r in records if r['role']=='plate')
          required=6 if book=='Fino_a_Dogali' else 5
          if n < required: raise SystemExit(f'{book}: {n}/{required} required plates acquired')
          PY
          python /tmp/fetch_art.py

      - name: Upload book illustration artifact
        uses: actions/upload-artifact@v4
        with:
          name: artwork-${{ matrix.book }}
          path: artwork/${{ matrix.book }}/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
