name: Boundary Bay Russian Collection 186 EPUB Archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bb-russian-collection-archive-20260923.yml'
      - 'scripts/bb_russian_archive.py'
      - 'collection/russian/roster.json'
  workflow_dispatch:
    inputs:
      checkpoint_tag:
        description: GitHub Release tag holding the approved 186-title checkpoints
        required: true
        type: string
        default: bb-russian-checkpoints

permissions:
  contents: read

concurrency:
  group: bb-russian-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CHECKPOINT_TAG: ${{ inputs.checkpoint_tag || 'bb-russian-checkpoints' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned official EPUBCheck 5.4.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/epubcheck.zip" \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          echo '33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  '"$RUNNER_TEMP/epubcheck.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP/epubcheck"
          test -f "$RUNNER_TEMP/epubcheck/epubcheck-5.4.0/epubcheck.jar"

      - name: Verify all 186 titles and assemble archives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bb_russian_archive.py \
            --tag "$CHECKPOINT_TAG" \
            --roster collection/russian/roster.json \
            --epubcheck-jar "$RUNNER_TEMP/epubcheck/epubcheck-5.4.0/epubcheck.jar" \
            --output "$RUNNER_TEMP/verified-russian-collection"
          mv "$RUNNER_TEMP/verified-russian-collection" ./verified-russian-collection

      - name: Publish verified archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: BB_Russian_Collection_186_verified
          path: verified-russian-collection/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
