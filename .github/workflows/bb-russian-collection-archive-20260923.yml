name: Boundary Bay Russian Collection 45 EPUB Archive
on:
  push:
    paths:
      - '.github/workflows/bb-russian-collection-archive-20260923.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bb-russian-collection-archive-20260923
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify 45 EPUB files
        env:
          FILES_B64: ""
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import concurrent.futures
          import hashlib
          import json
          import os
          import shutil
          import urllib.request
          from pathlib import Path

          entries = json.loads(base64.b64decode(os.environ["FILES_B64"]))
          assert len(entries) == 45, len(entries)
          out = Path("Boundary_Bay_Russian_Collection_45_EPUBs")
          out.mkdir(parents=True, exist_ok=True)

          def fetch(entry):
              target = out / entry["name"]
              req = urllib.request.Request(entry["url"], headers={"User-Agent": "Boundary-Bay-Archive/1.0"})
              with urllib.request.urlopen(req, timeout=600) as src, target.open("wb") as dst:
                  shutil.copyfileobj(src, dst, length=1024 * 1024)
              actual = target.stat().st_size
              if actual != entry["size"]:
                  raise RuntimeError(f"SIZE_MISMATCH {entry['name']} expected={entry['size']} actual={actual}")
              return entry["name"], actual

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results = list(pool.map(fetch, entries))

          epubs = sorted(out.glob("*.epub"))
          assert len(epubs) == 45, len(epubs)
          total = sum(p.stat().st_size for p in epubs)
          assert total == 590966791, total

          rows = []
          for path in epubs:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append(f"{digest}  {path.stat().st_size:>10}  {path.name}")

          readme = """Boundary Bay Classics — Russian Collection
Current combined EPUB archive prepared 2026-09-23.

Contents: 45 EPUB files
Total EPUB bytes: 590,966,791
Status: 44 files marked REVIEW; 1 file (rank 038, Poor Folk) remains explicitly marked ILLUSTRATIONS_PENDING.
The original status labels are preserved in filenames.

See SHA256SUMS.txt for file sizes and SHA-256 checksums.
"""
          (out / "README.txt").write_text(readme, encoding="utf-8")
          (out / "SHA256SUMS.txt").write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"ARCHIVE_READY epubs={len(epubs)} bytes={total}")
          PY

      - name: Upload one downloadable ZIP archive
        uses: actions/upload-artifact@v4
        with:
          name: Boundary_Bay_Russian_Collection_45_EPUBs
          path: Boundary_Bay_Russian_Collection_45_EPUBs/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
