name: BB single title 074 - historical edition discovery
on:
  push:
    branches: ['bb-onebyone-sources-20260907']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Identify source editions without assuming title matches are complete novels
        run: |
          mkdir -p output
          python - <<'PY'
          from urllib.request import urlopen,Request
          from urllib.parse import urlencode,quote
          from pathlib import Path
          import json,time,hashlib
          root=Path('output');results=[]
          queries=['title:(camelie) AND mediatype:texts','title:(camelie) AND creator:(Dumas)','title:(camellie) AND mediatype:texts']
          for i,q in enumerate(queries):
            url='https://archive.org/advancedsearch.php?'+urlencode({'q':q,'fl[]':['identifier','title','creator','date','language','description','collection'],'rows':100,'output':'json'},doseq=True)
            try:
              data=urlopen(Request(url,headers={'User-Agent':'BoundaryBaySourceResearch/1.0'}),timeout=60).read()
              (root/f'ia_search_{i}.json').write_bytes(data)
              docs=json.loads(data)['response']['docs']
              print(json.dumps({'query':q,'docs':docs},ensure_ascii=False),flush=True)
              results.extend(docs)
            except Exception as e:print(str(e),flush=True)
            time.sleep(2)
          seen=set()
          for d in results:
            iid=d['identifier']
            if iid in seen:continue
            seen.add(iid)
            date=str(d.get('date',''))
            if date and date[:4].isdigit() and int(date[:4])>1930:continue
            try:
              data=urlopen(Request('https://archive.org/metadata/'+quote(iid),headers={'User-Agent':'BoundaryBaySourceResearch/1.0'}),timeout=60).read()
              (root/(iid+'_metadata.json')).write_bytes(data)
              obj=json.loads(data)
              fs=[{k:f.get(k) for k in ['name','format','size','md5','sha1','private']} for f in obj.get('files',[]) if f.get('format') in ['Text PDF','Image Container PDF','DjVuTXT','Djvu XML','EPUB','Abbyy GZ','Scandata'] or f.get('name','').endswith('_djvu.txt')]
              print(json.dumps({'id':iid,'metadata':obj.get('metadata'),'files':fs},ensure_ascii=False),flush=True)
            except Exception as e:print(iid,str(e),flush=True)
            time.sleep(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bb-single-074-discovery
          path: output/
          retention-days: 14
          if-no-files-found: error
