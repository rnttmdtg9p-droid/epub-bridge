name: BB single title 099 - I Ricordi Moricca 1923
on:
  push:
    branches: ['bb-onebyone-sources-20260907']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve one complete historical scan and provider text derivatives
        run: |
          mkdir -p output
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import quote
          import json,hashlib,time,zipfile,io
          root=Path('output');events=[];identifier='marco-aurelio-ricordi-moricca'
          def fetch(url,name,expected=None):
            for attempt in range(3):
              try:
                with urlopen(Request(url,headers={'User-Agent':'BoundaryBaySourceResearch/1.0'}),timeout=60) as r:
                  b=r.read(85000001)
                  if len(b)>85000000:raise ValueError('size limit')
                  entry={'url':url,'file':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'sha1':hashlib.sha1(b).hexdigest(),'md5':hashlib.md5(b).hexdigest(),'status':'SAVED'}
                if expected:
                  entry['upstream_hash_checks']={k:entry[k]==expected[k] for k in ['sha1','md5'] if expected.get(k)}
                  if not all(entry['upstream_hash_checks'].values()):raise ValueError('upstream hash mismatch')
                (root/name).write_bytes(b);events.append(entry);print(json.dumps(entry),flush=True);return b
              except Exception as e:
                if attempt<2:time.sleep(3)
                else:events.append({'url':url,'file':name,'status':'FAILED','error':str(e)});return b''
          data=fetch('https://archive.org/metadata/'+identifier,'archive_metadata.json')
          if data:
            md=json.loads(data);files={f['name']:f for f in md.get('files',[])}
            wanted=['MarcoAurelioRicordiMoricca.pdf','MarcoAurelioRicordiMoricca_text.pdf','MarcoAurelioRicordiMoricca_djvu.txt','MarcoAurelioRicordiMoricca_djvu.xml','MarcoAurelioRicordiMoricca.epub','MarcoAurelioRicordiMoricca_scandata.xml','MarcoAurelioRicordiMoricca_page_numbers.json']
            for name in wanted:
              f=files.get(name)
              if not f or f.get('private') in ('true',True):
                events.append({'file':name,'status':'NOT_PUBLICLY_LISTED'});continue
              b=fetch('https://archive.org/download/'+identifier+'/'+quote(name),name,f)
              if b and name.endswith('.epub'):
                with zipfile.ZipFile(io.BytesIO(b)) as z:
                  events.append({'file':name,'epub_crc':'PASS' if z.testzip() is None else 'FAIL','members':len(z.namelist())})
          (root/'transfer_log.json').write_text(json.dumps(events,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'scope.json').write_text(json.dumps({'rank':99,'requested':'Meditazioni','source_title':'I Ricordi','translator':'Umberto Moricca','edition':'Torino: Chiantore, 1923','status':'ACQUIRED_FILES_REQUIRE_LOCAL_INSPECTION','ocr':'Provider OCR, not proofread','rights':'REVIEW_REQUIRED'},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload exact files and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-single-099-ricordi-moricca
          path: output/
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
