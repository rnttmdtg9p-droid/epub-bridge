name: BB single title 056 - Lo scritto rosso
on:
  push:
    branches: ['bb-onebyone-sources-20260907']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve one historical Italian edition
        run: |
          mkdir -p output
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import urljoin,urlparse,unquote
          import json,re,html,hashlib,time,zipfile,io
          root=Path('output'); events=[]
          def fetch(url,name):
            for attempt in range(2):
              try:
                req=Request(url,headers={'User-Agent':'BoundaryBaySourceResearch/1.0'})
                with urlopen(req,timeout=50) as r:
                  b=r.read(80000001)
                  if len(b)>80000000:raise ValueError('size limit')
                  entry={'url':url,'final_url':r.url,'file':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'status':'SAVED','content_type':r.headers.get('Content-Type')}
                (root/name).write_bytes(b);events.append(entry);print(json.dumps(entry),flush=True);return b
              except Exception as e:
                if attempt==0:time.sleep(2)
                else:events.append({'url':url,'file':name,'status':'FAILED','error':str(e)});return b''
          page='https://liberliber.it/autori/autori-d/arthur-conan-doyle/lo-scritto-rosso/'
          raw=fetch(page,'provider_page.html').decode('utf-8','replace')
          decoded=html.unescape(raw).replace('\\/','/')
          urls=set(re.findall(r'https?://[^\s\"\'<>]+',decoded))
          candidates=[u for u in urls if 'lo_scritto_rosso' in u and re.search(r'\.(pdf|odt|epub)(?:\?|$)',u)]
          # Published provider directory convention is only a transport probe, never identity evidence.
          if not candidates:
            candidates=['https://www.liberliber.eu/mediateca/libri/d/doyle/lo_scritto_rosso/'+ext+'/doyle_lo_scritto_rosso.'+ext for ext in ('odt','pdf')]
          (root/'discovered_links.json').write_text(json.dumps(sorted(urls),indent=2))
          for u in sorted(candidates):
            name=unquote(Path(urlparse(u).path).name)
            b=fetch(u,name)
            if b and name.endswith('.odt'):
              try:
                with zipfile.ZipFile(io.BytesIO(b)) as z:
                  if z.testzip():raise ValueError('CRC failure')
                  (root/'odt_content.xml').write_bytes(z.read('content.xml'))
                  if 'meta.xml' in z.namelist():(root/'odt_metadata.xml').write_bytes(z.read('meta.xml'))
              except Exception as e:events.append({'file':name,'validation_error':str(e)})
          (root/'transfer_log.json').write_text(json.dumps(events,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'scope.json').write_text(json.dumps({'rank':56,'requested':'Uno studio in rosso','source_title':'Lo scritto rosso','edition':'Salani 1915','stage':'SOURCE_ACQUISITION_ONLY','rights':'REVIEW_REQUIRED; provider CC BY-NC-SA notice must be preserved','source_url':page},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload exact source bytes and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-single-056-scritto-rosso
          path: output/
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
