name: BB single title 082 - historical Italian source discovery
on:
  push:
    branches: ['bb-onebyone-sources-20260907']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Identify historical Italian source candidates without substituting modern translations
        run: |
          mkdir -p output
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode,quote
          from pathlib import Path
          import json,time,hashlib
          root=Path('output');logs=[];seen=set()
          def get(url,name):
            for attempt in range(2):
              try:
                b=urlopen(Request(url,headers={'User-Agent':'BoundaryBaySourceResearch/1.0 (historical Italian editions)'}),timeout=60).read(15000000)
                (root/name).write_bytes(b);logs.append({'url':url,'path':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'status':'SAVED'});return json.loads(b)
              except Exception as e:
                logs.append({'url':url,'path':name,'status':'FAILED','error':str(e)})
                if attempt==0:time.sleep(15)
            return {}
          queries=['creator:maupassant AND (language:ita OR language:Italian) AND mediatype:texts','title:(sego) AND mediatype:texts','creator:(Boari) AND mediatype:texts']
          for i,q in enumerate(queries):
            url='https://archive.org/advancedsearch.php?'+urlencode({'q':q,'fl[]':['identifier','title','creator','date','language','description','collection'],'rows':150,'output':'json'},doseq=True)
            o=get(url,f'ia_search_{i}.json');docs=o.get('response',{}).get('docs',[]);print(json.dumps(docs,ensure_ascii=False),flush=True)
            for d in docs:
              iid=d['identifier'];date=str(d.get('date',''))
              if iid in seen:continue
              seen.add(iid)
              if not date[:4].isdigit() or int(date[:4])>1930:continue
              o=get('https://archive.org/metadata/'+quote(iid),iid+'_metadata.json')
              print(json.dumps({'id':iid,'metadata':o.get('metadata'),'files':[{k:f.get(k) for k in ['name','format','size','md5','sha1','private']} for f in o.get('files',[]) if f.get('format') in ['Text PDF','Image Container PDF','DjVuTXT','Djvu XML','Scandata']]},ensure_ascii=False),flush=True);time.sleep(2)
          (root/'transfer_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb-single-082-discovery
          path: output/
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
