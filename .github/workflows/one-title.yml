name: BB single title 075 - Goriot edition discovery
on:
  push:
    branches: ['bb-onebyone-sources-20260907']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find precise Italian source editions before attempting download
        run: |
          mkdir -p output
          python - <<'PY'
          from urllib.request import urlopen,Request
          from urllib.parse import urlencode,quote
          from pathlib import Path
          import json,time,hashlib
          root=Path('output');logs=[]
          def get(url,name):
            try:
              data=urlopen(Request(url,headers={'User-Agent':'BoundaryBaySourceResearch/1.0 (historical Italian literature)'}),timeout=60).read(14000000)
              (root/name).write_bytes(data);logs.append({'url':url,'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'status':'SAVED'});return json.loads(data)
            except Exception as e:logs.append({'url':url,'name':name,'status':'FAILED','error':str(e)});return {}
          queries=['title:goriot AND mediatype:texts AND (language:ita OR language:Italian)','title:(goriot) AND (title:(papa OR padre OR babbo)) AND mediatype:texts']
          seen=set()
          for i,q in enumerate(queries):
            url='https://archive.org/advancedsearch.php?'+urlencode({'q':q,'fl[]':['identifier','title','creator','date','language','description','collection'],'rows':100,'output':'json'},doseq=True)
            obj=get(url,f'ia_search_{i}.json');docs=obj.get('response',{}).get('docs',[]);print(json.dumps(docs,ensure_ascii=False),flush=True)
            for d in docs:
              iid=d['identifier'];date=str(d.get('date',''))
              if iid in seen:continue
              seen.add(iid)
              if date[:4].isdigit() and int(date[:4])>1930:continue
              obj=get('https://archive.org/metadata/'+quote(iid),iid+'_metadata.json')
              fs=[{k:f.get(k) for k in ['name','format','size','md5','sha1','private']} for f in obj.get('files',[]) if f.get('format') in ['Text PDF','Image Container PDF','DjVuTXT','Djvu XML','EPUB','Scandata']]
              print(json.dumps({'id':iid,'metadata':obj.get('metadata'),'files':fs},ensure_ascii=False),flush=True);time.sleep(2)
          (root/'transfer_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb-single-075-discovery
          path: output/
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
