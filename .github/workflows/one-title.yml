name: BB single title 082 - anthology text check
on:
  push:
    branches: ['bb-onebyone-sources-20260907']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Save historical anthology OCR and matched scan candidates for title-scope review
        run: |
          mkdir -p output
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.parse import quote
          from pathlib import Path
          import json,re,hashlib,time
          root=Path('output');logs=[];results=[]
          def get(url,path,limit=40000000):
            for n in range(2):
              try:
                with urlopen(Request(url,headers={'User-Agent':'BoundaryBaySourceResearch/1.0 (historical Italian editions)'}),timeout=80) as r:b=r.read(limit+1)
                if len(b)>limit:raise ValueError('size safety limit')
                path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(b);return b
              except Exception:
                if n==1:raise
                time.sleep(15)
          for iid in ['maupassant-racconti-novelle','maupassant-racconti-cinti','maupassant-dolore-segreto']:
            d=root/iid;d.mkdir(exist_ok=True);rec={'id':iid}
            try:
              md=json.loads(get('https://archive.org/metadata/'+iid,d/'metadata.json'))
              if str(md['metadata'].get('access-restricted-item','false')).lower()=='true':raise ValueError('restricted item')
              textfiles=[f for f in md['files'] if f['name'].endswith('_djvu.txt') and not f.get('private')]
              matches=[]
              for f in textfiles:
                url='https://archive.org/download/'+iid+'/'+quote(f['name']);b=get(url,d/f['name'])
                h=hashlib.md5(b).hexdigest();ok=h==f.get('md5');logs.append({'url':url,'path':str((d/f['name']).relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'upstream_md5':f.get('md5'),'md5_match':ok,'status':'SAVED'})
                if not ok:raise ValueError('checksum mismatch')
                text=b.decode('utf8',errors='replace')
                matches=[{'offset':m.start(),'context':text[max(0,m.start()-150):m.end()+300]} for m in re.finditer(r'boule|pallina|palla\s+di\s+(?:sego|burro)|rouen|cornudet',text,re.I)]
                rec['matches']=matches;rec['text_bytes']=len(b)
              if any(re.search(r'pallina|palla\s+di\s+sego|cornudet',x['context'],re.I) for x in matches):
                picks=[f for f in md['files'] if not f.get('private') and (f.get('format')=='Image Container PDF' or f['name'].endswith(('_djvu.xml','_scandata.xml')))]
                for f in picks:
                  url='https://archive.org/download/'+iid+'/'+quote(f['name']);b=get(url,d/f['name'])
                  ok=hashlib.md5(b).hexdigest()==f.get('md5')
                  logs.append({'url':url,'path':str((d/f['name']).relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'upstream_md5':f.get('md5'),'md5_match':ok,'status':'SAVED'})
                  if not ok:raise ValueError('checksum mismatch')
                  time.sleep(2)
            except Exception as e:rec['error']=str(e)
            results.append(rec);print(json.dumps(rec,ensure_ascii=False),flush=True);time.sleep(2)
          (root/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'transfer_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb-single-082-anthology-check
          path: output/
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
