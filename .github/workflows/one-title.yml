name: BB single title 100 - Plato Italian edition discovery
on:
  push:
    branches: ['bb-onebyone-sources-20260907']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover historical complete Italian Republic editions
        run: |
          mkdir -p output
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          import json,time,hashlib
          root=Path('output');log=[];summ=[]
          targets=[]
          queries=['title:repubblica AND creator:(Plato OR Platone)','title:(republica OR repubblica) AND language:ita','creator:Fraccaroli AND (Plato OR Platone)','title:repubblica AND (Zambelli OR Bembo OR Martini)','title:republica AND creator:(Plato OR Platone)']
          for i,q in enumerate(queries):
            targets.append((f'ia_search_{i}.json','https://archive.org/advancedsearch.php?'+urlencode({'q':q,'rows':100,'output':'json','fl[]':['identifier','title','creator','date','language','collection','access-restricted-item']},doseq=True),'ia'))
          for i,t in enumerate(['Autore:Platone','La Repubblica','Repubblica']):
            targets.append((f'ws_{i}.json','https://it.wikisource.org/w/api.php?'+urlencode({'action':'parse','page':t,'prop':'text|links|revid|wikitext','format':'json','redirects':1,'maxlag':5}),'ws'))
          for name,url,typ in targets:
            try:
              with urlopen(Request(url,headers={'User-Agent':'BoundaryBaySourceResearch/1.0 (sequential historical-edition acquisition)'}),timeout=45) as r:data=r.read(8000001)
              if len(data)>8000000:raise ValueError('response size limit')
              obj=json.loads(data);(root/name).write_bytes(data)
              row={'path':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'status':'SAVED'}
              if typ=='ia':
                summ.append({'file':name,'found':obj.get('response',{}).get('numFound'),'docs':obj.get('response',{}).get('docs',[])})
              else:
                p=obj.get('parse',{});summ.append({'file':name,'title':p.get('title'),'links':p.get('links',[]),'error':obj.get('error')})
            except Exception as e:row={'path':name,'url':url,'status':'FAILED','error':str(e)}
            log.append(row);print(json.dumps(row),flush=True);time.sleep(4)
          (root/'DISCOVERY_SUMMARY.json').write_text(json.dumps(summ,ensure_ascii=False,indent=2),encoding='utf8')
          (root/'transfer_log.json').write_text(json.dumps(log,ensure_ascii=False,indent=2),encoding='utf8')
          PY
      - name: Upload discovery evidence, not a completed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-single-100-discovery
          path: output/
          compression-level: 6
          retention-days: 14
          if-no-files-found: error
