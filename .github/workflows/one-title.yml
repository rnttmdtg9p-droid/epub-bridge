name: BB single title 079 - Germinal two-volume discovery
on:
  push:
    branches: ['bb-onebyone-sources-20260907']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Identify both Italian volumes and exact unrestricted scan filenames
        run: |
          mkdir -p output
          python - <<'PY'
          from urllib.request import urlopen,Request
          from urllib.parse import urlencode,quote
          from pathlib import Path
          import json,time,hashlib
          root=Path('output');logs=[]
          def get(url,name):
            try:
              data=urlopen(Request(url,headers={'User-Agent':'BoundaryBaySourceResearch/1.0 (historical Italian editions)'}),timeout=65).read(12000000)
              (root/name).write_bytes(data);obj=json.loads(data)
              logs.append({'url':url,'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'status':'SAVED'})
              return obj
            except Exception as e:logs.append({'url':url,'name':name,'status':'FAILED','error':str(e)});return {}
          for vol in [1,2]:
            title=f'File:Zola - Germinal. {vol}, dopo il 1885.djvu'
            url='https://commons.wikimedia.org/w/api.php?'+urlencode({'action':'query','titles':title,'prop':'imageinfo|revisions','iiprop':'url|size|sha1|extmetadata','rvprop':'content','format':'json'})
            obj=get(url,f'commons_vol{vol}.json');print(json.dumps(obj,ensure_ascii=False)[:35000],flush=True);time.sleep(3)
          query='title:(germinal OR germinale) AND (language:ita OR language:Italian) AND mediatype:texts'
          url='https://archive.org/advancedsearch.php?'+urlencode({'q':query,'fl[]':['identifier','title','creator','date','language','description','collection'],'rows':100,'output':'json'},doseq=True)
          obj=get(url,'ia_search.json');docs=obj.get('response',{}).get('docs',[]);print(json.dumps(docs,ensure_ascii=False),flush=True)
          for d in docs:
            iid=d['identifier'];date=str(d.get('date',''))
            if date[:4].isdigit() and int(date[:4])>1930:continue
            obj=get('https://archive.org/metadata/'+quote(iid),iid+'_metadata.json')
            fs=[{k:f.get(k) for k in ['name','format','size','md5','sha1','private']} for f in obj.get('files',[]) if f.get('format') in ['Text PDF','Image Container PDF','DjVuTXT','Djvu XML','EPUB','Scandata'] or f.get('name','').endswith('_djvu.txt')]
            print(json.dumps({'id':iid,'metadata':obj.get('metadata'),'files':fs},ensure_ascii=False),flush=True);time.sleep(1)
          (root/'transfer_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb-single-079-discovery
          path: output/
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
