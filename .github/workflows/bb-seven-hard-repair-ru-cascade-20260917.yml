name: BB seven Russian source-bound cascade repair 20260917

on:
  push:
    paths:
      - ".github/workflows/bb-seven-hard-repair-ru-cascade-20260917.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bb-seven-russian-source-bound-cascade-repair-20260917
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Marian runtime
        run: |
          python -m pip install --quiet 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers==4.56.2' 'sentencepiece==0.2.1' 'sacremoses==0.1.1'
      - name: Restore documented model cascade cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bb-targeted-marian-ru-en-it-transformers-4.56.2-v2
      - name: Download immutable source and target alignments
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_IDS: "10468694881 10435059960 10469221277"
        run: |
          mkdir -p inputs
          for id in $ARTIFACT_IDS; do
            mkdir -p "inputs/$id"
            curl --fail --location --retry 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip" \
              -o "inputs/$id.zip"
            unzip -q "inputs/$id.zip" -d "inputs/$id"
          done
      - name: Replace only source-bound hard-fault units
        run: >-
          python scripts/bb_targeted_marian_hard_repair.py
          --inputs inputs
          --out dist/ru
          --language ru
          --ranks "061,063,064"
      - name: Upload correction ledger and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-seven-hard-repair-ru-cascade-20260917
          path: dist
          if-no-files-found: error
          retention-days: 30
