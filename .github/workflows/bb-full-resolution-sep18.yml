           try:
            r=requests.get(url,timeout=60);r.raise_for_status();out.joinpath(url.split('/')[-1]).write_bytes(r.content);d['sha256']=hashlib.sha256(r.content).hexdigest()
           except Exception as e:d['error']=str(e)
           log.append(d)
          ROOT.joinpath('metadata.json').write_text(json.dumps(log,indent=2))
