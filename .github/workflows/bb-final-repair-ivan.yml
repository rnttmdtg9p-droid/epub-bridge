name: BB final MADLAD repair Ivan Ilyich

on:
  workflow_run:
    workflows: ["BB Ivan Ilyich small-shard recovery"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Install exact translation and EPUB tools
        run: |
          python -m pip install --quiet 'ctranslate2==4.6.0' 'sentencepiece==0.2.1' 'huggingface_hub==0.34.4' 'Pillow>=11,<13' 'beautifulsoup4>=4.12,<5' 'lxml>=5,<7'
          mkdir -p assets/fonts
          curl --fail --location --retry 3 -o assets/fonts/Spectral-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/spectral/Spectral-Regular.ttf
          curl --fail --location --retry 3 -o assets/fonts/Spectral-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/spectral/Spectral-Bold.ttf
      - name: Restore MADLAD runtime cache
        uses: actions/cache@v4
        with:
          path: |
            madlad_ct2
            madlad_tokenizer
          key: bb-madlad400-3b-mt-ct2-int8-v1
      - name: Materialize exact MADLAD runtime
        run: >-
          python -c "from huggingface_hub import snapshot_download,hf_hub_download;
          snapshot_download(repo_id='Heng666/madlad400-3b-mt-ct2-int8',local_dir='madlad_ct2');
          hf_hub_download(repo_id='google/madlad400-3b-mt',filename='spiece.model',local_dir='madlad_tokenizer')"
      - uses: actions/download-artifact@v4
        with:
          name: bb-061-small-r3-prepared-sources
          path: prepared
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: bb-061-la-morte-di-ivan-ilic-italian-review
          path: candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Repair flagged aligned units with MADLAD
        run: |
          mkdir -p repaired dist
          alignment="$(find candidate -name '061_alignment.jsonl' -print -quit)"
          test -n "$alignment"
          python scripts/bb_repair_alignment.py --alignment "$alignment" --out repaired/061_alignment.jsonl --language ru --report dist/061_repair_QA.json
          python -c "import json; d=json.load(open('dist/061_repair_QA.json')); assert d['remaining_flagged_unit_count']==0, d"
      - name: Reassemble corrected BB REVIEW EPUB
        run: >-
          python scripts/bb_translate_wikisource.py
          --config configs/061_smert_ivana.json
          --out dist/061
          --mode assemble
          --source-bundle prepared/061/061_source_bundle.json
          --shards-dir repaired
      - name: EPUBCheck 5.2.1
        run: |
          curl --fail --location --retry 3 -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          java -jar /tmp/epubcheck/epubcheck-5.2.1/epubcheck.jar "$(find dist/061 -name '*.epub' -print -quit)" 2>&1 | tee dist/061/061_EPUBCHECK.log
      - name: Upload corrected title checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-final-061-italian-review
          path: dist
          if-no-files-found: error
          retention-days: 30
