name: Rank 33 Official EPUBCheck Tool Acquisition
on:
  push:
    branches: [bb-ru33-french-claude-independent-review-20261105]
    paths: ['.github/workflows/bb-ru33-epubcheck-tool.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtain official EPUBCheck 5.4.0 binaries
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o epubcheck-5.4.0.zip
          echo "Official release archive SHA256:"
          sha256sum epubcheck-5.4.0.zip
          unzip -t epubcheck-5.4.0.zip | tail -2
      - name: Preserve official binaries
        uses: actions/upload-artifact@v4
        with:
          name: ru33-epubcheck-5.4.0-official
          path: epubcheck-5.4.0.zip
          if-no-files-found: error
          retention-days: 3
