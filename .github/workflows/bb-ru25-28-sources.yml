name: Recover Russian source batch 25 to 28
on:
  push:
    paths: ['.github/workflows/bb-ru25-28-sources.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original source pages
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,time
          from pathlib import Path
          root=Path('results/ru25-28-sources');root.mkdir(parents=True,exist_ok=True)
          ledger=[]
          titles=[(25,'Бесы (Достоевский)')]+[(25,f'Бесы (Достоевский)/Часть {part}/Глава {chapter}') for part,n in [(1,5),(2,10),(3,8)] for chapter in range(1,n+1)]+[(25,'Бесы (Достоевский)/Приложение/Глава 9'),(26,'Смерть Ивана Ильича (Толстой)'),(27,'Детство (Толстой)'),(27,'Отрочество (Толстой)'),(27,'Юность (Толстой)'),(28,'Белые ночи (Достоевский)')]
          for i,(rank,title) in enumerate(titles):
            url='https://ru.wikisource.org/w/api.php?'+urllib.parse.urlencode({'action':'parse','page':title,'prop':'text|revid','format':'json'})
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'BBClassicsProduction/1.0 (public-domain source research)'})
              data=json.load(urllib.request.urlopen(req,timeout=60));text=data['parse']['text']['*']
              name=f'{rank:03}-{i:03}.html';(root/name).write_text(text)
              ledger.append({'rank':rank,'title':title,'file':name,'revision':data['parse']['revid'],'sha256':hashlib.sha256(text.encode()).hexdigest(),'status':'RECOVERED'})
            except Exception as e:ledger.append({'rank':rank,'title':title,'status':'FAILED','error':str(e)})
          (root/'ledger.json').write_text(json.dumps(ledger,ensure_ascii=False,indent=2))
          print([(x['title'],x['status']) for x in ledger])
          PY
      - name: Save public source checkpoint
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ru25-28-sources/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save Russian public-domain source batch25-28"
          git pull --rebase origin main
          git push origin HEAD:main
