name: BB rank86 authorised abridged summaries independent OpenAI review
on:
  push:
    paths: ['.github/workflows/bb-ru86-summary-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-russian-sequential-rank86-summary-review
  cancel-in-progress: false
jobs:
  independent-summary-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb-ru86-claude-20261030
      - name: Independent OpenAI review only; never Claude
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/bb_ru86_summary_review.py
      - name: Preserve review or exact failure without restricted source text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru86-summary-review
          path: results/ru86-summary-review/
          retention-days: 90
          if-no-files-found: error
