name: BB Russian59 corrected sequential original translation and review
on:
  push:
    paths: ['.github/workflows/bb-ru59-original.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-ru59-original-v5070
  cancel-in-progress: false
jobs:
  unit01:
    name: Source unit 01 of16 with complete review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Translate, review and independently verify this complete unit
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          BB_UNIT: '1'
        run: python3 scripts/bb_ru59_original.py
      - name: Preserve actual provider exchanges and complete or partial work
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru59-original-unit-001-v5070
          path: results/ru59-original/
          retention-days: 90
          if-no-files-found: warn
