name: BB Russian 71 complete verified original DeepL translation
on:
  push:
    paths:
      - '.github/workflows/bb-ru71-complete-original-resume4.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore saved rank 71 units and paragraphs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40169190834
          pattern: ru71-deepl-*
          path: translation/ru71
          merge-multiple: true
      - name: Translate authenticated unit 00 preface
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        run: python3 bb-ru71-20261025/tools/translate_unit71.py 0
      - name: Preserve aligned unit 00 before advancing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru71-deepl-00-preface
          path: translation/ru71/00-preface.json
          if-no-files-found: warn
          retention-days: 90
      - name: Translate authenticated unit 01 chapter-01
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        run: python3 bb-ru71-20261025/tools/translate_unit71.py 1
      - name: Preserve aligned unit 01 before advancing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru71-deepl-01-chapter-01
          path: translation/ru71/01-chapter-01.json
          if-no-files-found: warn
          retention-days: 90
      - name: Translate authenticated unit 02 chapter-02
