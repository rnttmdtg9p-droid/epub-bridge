name: German 168 and 171 source research
on:
  push:
    branches: [bb-german-168-171-sources-20261030]
    paths: [.github/workflows/bb-german-168-171-research.yml]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Research public source candidates
        shell: python
        run: |
          import urllib.request, urllib.parse, json, concurrent.futures, pathlib
          queries = ['Nesthäkchen und ihre Puppen Else Ury', 'Die vierzig Tage des Musa Dagh Franz Werfel']
          urls = [
            'https://projekt-gutenberg.org/authors/else-ury/',
            'https://projekt-gutenberg.org/authors/franz-werfel/',
            'https://www.projekt-gutenberg.org/ury/nestpup/nestpup.html',
            'https://www.projekt-gutenberg.org/werfel/musadagh/musadagh.html',
            'https://www.zeno.org/Literatur/M/Ury,+Else',
            'https://www.zeno.org/Literatur/M/Werfel,+Franz',
            'https://www.literaturdownload.at/werfel.html',
            'https://gutenberg.ca/index.html',
            'https://www.fadedpage.com/csearch.php?author=Werfel%2C%20Franz',
          ]
          for q in queries:
            urls += [
              'https://archive.org/advancedsearch.php?output=json&rows=30&q='+urllib.parse.quote(q)+'&fl[]=identifier&fl[]=title&fl[]=language&fl[]=date',
              'https://www.google.com/search?q='+urllib.parse.quote(q+' full text deutsch pdf'),
              'https://www.bing.com/search?q='+urllib.parse.quote(q+' volltext pdf epub'),
              'https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q+' volltext pdf epub'),
            ]
          def fetch(url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Boundary Bay source research)'})
              with urllib.request.urlopen(req,timeout=35) as r:
                body=r.read(800000).decode('utf-8',errors='replace')
                return {'url':url,'status':r.status,'final_url':r.url,'body':body}
            except Exception as e: return {'url':url,'error':str(e)}
          out=list(concurrent.futures.ThreadPoolExecutor(max_workers=8).map(fetch,urls))
          p=pathlib.Path('results/german-168-171-research.json');p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2))
          for r in out: print(r['url'],r.get('status'),r.get('error',''),len(r.get('body','')))
      - name: Preserve research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/german-168-171-research.json
          git commit -m "Record German 168 and 171 source research"
          git push origin HEAD:bb-german-168-171-sources-20261030
