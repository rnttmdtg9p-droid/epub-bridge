name: BB humour remaining assets
on:
  push:
    paths: ['.github/workflows/bb-humour-retry-20260923.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests pillow
      - run: |
          python - <<'PY'
          import requests,pathlib,json,hashlib,time
          from PIL import Image
          from io import BytesIO
          from urllib.parse import quote
          root=pathlib.Path('acquired/bb-humour-20260923')
          ledger=json.loads((root/'ledger.json').read_text())
          for row in ledger:
           if row['status']=='downloaded':continue
           for delay in [1,15,45,60]:
            time.sleep(delay)
            try:
             r=requests.get(row['url'].replace('%2C',','),timeout=40);r.raise_for_status()
             Image.open(BytesIO(r.content)).convert('RGB').save(root/(row['id']+'.jpg'),quality=95)
             row['status']='downloaded';row['size']=Image.open(root/(row['id']+'.jpg')).size
             row['sha256']=hashlib.sha256((root/(row['id']+'.jpg')).read_bytes()).hexdigest();break
            except Exception as e:row['error']=str(e)
          (root/'ledger.json').write_text(json.dumps(ledger,indent=2))
          diary=root/'diary';diary.mkdir(exist_ok=True)
          pages=[16,18,20,30,31,33,35,43,47,51,54,63,69,71,74,79,84,86,87,90,98,100,108,126,128,130,173,187,201,208,224,243]
          for p in pages:
           name='Diary_of_a_Nobody_P%03d.jpg'%p;md=hashlib.md5(name.encode()).hexdigest()
           url='https://upload.wikimedia.org/wikipedia/commons/'+md[0]+'/'+md[:2]+'/'+name
           for delay in [2,20,60]:
            time.sleep(delay)
            try:
             r=requests.get(url,timeout=30);r.raise_for_status();Image.open(BytesIO(r.content)).convert('RGB').save(diary/name,quality=95);break
            except Exception as e:print(name,str(e))
          for i in range(1,25):
           try:
            r=requests.get('https://en.wikisource.org/wiki/The_Diary_of_a_Nobody/Chapter_'+str(i),timeout=30);r.raise_for_status();(diary/('chapter-%02d.html'%i)).write_bytes(r.content)
           except Exception as e:print(i,str(e))
           time.sleep(1)
          
          PY
      - run: |
          git config user.name "BB asset acquisition"
          git config user.email "actions@users.noreply.github.com"
          git add acquired/bb-humour-20260923
          git commit -m "Recover remaining public humour assets" || true
          git pull --rebase origin main
          git push origin HEAD:main
