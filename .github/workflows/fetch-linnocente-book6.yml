name: Fetch L'Innocente Book 6 Sources
on:
  push:
    paths:
      - '.github/workflows/fetch-linnocente-book6.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip -q install requests
      - run: curl -fL -o a.py https://raw.githubusercontent.com/rnttmdtg9p-droid/epub-bridge/57ca945ca8e88baf436970aed4a635087b8d02fe/tools/bb075_goriot.py
      - run: python a.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb075-goriot
          path: goriot
          retention-days: 14
