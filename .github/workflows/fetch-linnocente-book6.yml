name: Fetch L'Innocente Book 6 Sources
on:
  push:
    paths:
      - '.github/workflows/fetch-linnocente-book6.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: python -m pip -q install requests
      - run: curl -fL -o cf.py https://raw.githubusercontent.com/rnttmdtg9p-droid/epub-bridge/68d3324ae41dc651c7a826ab21e0705780c00ec2/tools/bb16_commons_fast.py
      - run: python cf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb16-v5014-commons-fast
          path: commons_fast
          retention-days: 14
