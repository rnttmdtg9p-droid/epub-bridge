name: Fetch L'Innocente Book 6 Sources
on:
  push:
    paths:
      - '.github/workflows/fetch-linnocente-book6.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: python -m pip -q install requests beautifulsoup4 pillow
      - run: curl -fL -o pg.py https://raw.githubusercontent.com/rnttmdtg9p-droid/epub-bridge/bb16-v5014-assets-20260915/tools/bb16_pg_only.py
      - run: python pg.py
      - uses: actions/upload-artifact@v4
        with:
          name: bb16-v5014-pg-assets
          path: pg_assets
          retention-days: 14
