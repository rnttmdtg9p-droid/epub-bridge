name: Download German 077 and 098 sources
on:
  push:
    branches: [bb-german-077-098-sources-20261030]
    paths: [.github/workflows/bb-german-077-098-download.yml]
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 --quiet
      - name: Download each published German source section
        shell: python
        run: |
          import urllib.request,pathlib,concurrent.futures,hashlib,json,zipfile,time,re
          from bs4 import BeautifulSoup
          books=[
            ('077_Jeder_stirbt_fuer_sich_allein','https://projekt-gutenberg.org/authors/hans-fallada/books/jeder-stirbt-fuer-sich-allein'),
            ('098_Metropolis','https://projekt-gutenberg.org/authors/thea-von-harbou/books/metropolis')
          ]
          root=pathlib.Path('results/german-077-098-sources');root.mkdir(exist_ok=True)
          ledger=[]
          def fetch(u):
            for attempt in range(3):
              try:
                with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=45) as r:
                  assert r.status==200
                  return r.read()
              except Exception:
                if attempt==2:raise
                time.sleep(3)
          for name,base in books:
            landing=BeautifulSoup(fetch(base+'/'),'html.parser')
            nums=sorted(set(int(m.group(1)) for a in landing.select('a[href]') if (m:=re.search(r'/chapter/(\d+)(?:/)?$',a['href']))))
            assert nums==list(range(1,max(nums)+1)), 'chapter sequence gap'
            folder=root/name;folder.mkdir(exist_ok=True)
            def get(i):
              u=base+'/chapter/'+str(i)
              body=fetch(u);soup=BeautifulSoup(body,'html.parser')
              main=soup.select_one('main.book-reader__chapter-content')
              wrapper=main.select_one('.book-reader__chapter-content-wrapper') if main else None
              assert wrapper is not None,'missing source text'
              text=wrapper.get_text('\n',strip=True)
              assert len(text)>50,'empty section'
              (folder/(str(i).zfill(3)+'.html')).write_bytes(body)
              return i,text,{'section':i,'url':u,'characters':len(text),'html_sha256':hashlib.sha256(body).hexdigest()}
            got=sorted(concurrent.futures.ThreadPoolExecutor(max_workers=3).map(get,nums))
            full='\n\n'.join(t for i,t,m in got)
            (root/(name+'.txt')).write_text(full)
            ledger.append({'rank':name[:3],'url':base+'/','section_count':len(got),'characters':len(full),'source_sha256':hashlib.sha256(full.encode()).hexdigest(),'title_text':got[0][1],'first_text':got[1][1][:400],'last_text':got[-1][1][-800:],'evidence':[m for i,t,m in got]})
          pathlib.Path('results/german-077-098-evidence.json').write_text(json.dumps(ledger,ensure_ascii=False,indent=2))
          with zipfile.ZipFile('results/German_077_098_sources.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file():z.write(p,p.relative_to(root))
          print(json.dumps([{k:v for k,v in x.items() if k!='evidence'} for x in ledger],ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        with:
          name: German_077_098_sources
          path: results/German_077_098_sources.zip
      - name: Preserve source texts and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/german-077-098-sources results/german-077-098-evidence.json
          git commit -m "Preserve German source texts for ranks 77 and 98"
          git push origin HEAD:bb-german-077-098-sources-20261030
