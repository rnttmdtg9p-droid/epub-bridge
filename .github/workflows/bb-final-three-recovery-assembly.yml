name: BB final three recovery assembly

on:
  workflow_dispatch:
  push:
    paths:
      - "reports/bb_final_three_recovery_launch_20260916.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: bb-final-three-recovery-assembly-20260916
  cancel-in-progress: false

jobs:
  assemble-validate:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - rank: "055"
            config: configs/055_mastino_baskervilles.json
            engine: gutenberg
            key: il-mastino-dei-baskerville
            batch_key: bb-final3-055-20260916
            shard_count: 80
          - rank: "061"
            config: configs/061_smert_ivana.json
            engine: wikisource
            key: la-morte-di-ivan-ilic
            batch_key: bb-final3-061-20260916
            shard_count: 25
          - rank: "064"
            config: configs/064_idiota.json
            engine: wikisource
            key: l-idiota
            batch_key: bb-final3-064-20260916
            shard_count: 212
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_RUN_ID: "35128754290"
    steps:
      - uses: actions/checkout@v4

      - name: Install EPUB assembly tools
        run: |
          python -m pip install --quiet 'ctranslate2==4.6.0' 'sentencepiece==0.2.1' 'huggingface_hub==0.34.4' 'Pillow>=11,<13' 'beautifulsoup4>=4.12,<5' 'lxml>=5,<7'
          mkdir -p assets/fonts
          curl --fail --location --retry 3 -o assets/fonts/Spectral-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/spectral/Spectral-Regular.ttf
          curl --fail --location --retry 3 -o assets/fonts/Spectral-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/spectral/Spectral-Bold.ttf

      - name: Download frozen source bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ matrix.batch_key }}-prepared-sources
          path: prepared

      - name: Download every immutable shard artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: ${{ matrix.batch_key }}-repaired-shard-${{ matrix.rank }}-*
          path: fresh-shards
          merge-multiple: true

      - name: Backfill artifacts beyond action listing cap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected="${{ matrix.shard_count }}"
          rank="${{ matrix.rank }}"
          prefix="${{ matrix.batch_key }}-repaired-shard-${rank}-"
          mkdir -p fresh-shards/final
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | [.name, (.id | tostring)] | @tsv' \
            > /tmp/source-artifacts.tsv
          backfilled=0
          for index in $(seq 0 $((expected - 1))); do
            padded="$(printf '%04d' "$index")"
            final="fresh-shards/final/${rank}_shard_${padded}_alignment.jsonl"
            if [ -f "$final" ]; then
              continue
            fi
            name="${prefix}${padded}"
            artifact_id="$(awk -F '\t' -v name="$name" '$1 == name { print $2; exit }' /tmp/source-artifacts.tsv)"
            test -n "$artifact_id" || {
              echo "Missing source artifact $name" >&2
              exit 1
            }
            zip_path="/tmp/${artifact_id}.zip"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$zip_path" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
            unzip -oq "$zip_path" -d fresh-shards
            backfilled=$((backfilled + 1))
          done
          echo "Backfilled $backfilled shard artifacts beyond the action listing cap."

      - name: Verify shard inventory
        run: |
          actual="$(find fresh-shards/final -type f -name '${{ matrix.rank }}_shard_*_alignment.jsonl' | wc -l | tr -d ' ')"
          test "$actual" = "${{ matrix.shard_count }}" || {
            echo "Expected ${{ matrix.shard_count }} immutable shards for rank ${{ matrix.rank }}, found $actual" >&2
            exit 1
          }
          find fresh-shards/final -type f -name '${{ matrix.rank }}_shard_*_alignment.jsonl' | sort

      - name: Combine shards and enforce zero hard flags
        run: |
          language="$(python -c "import json; print(json.load(open('${{ matrix.config }}', encoding='utf-8'))['source_language'])")"
          mkdir -p combined repaired "dist/${{ matrix.rank }}_${{ matrix.key }}"
          find fresh-shards/final -type f -name '${{ matrix.rank }}_shard_*_alignment.jsonl' -print0 | sort -z | xargs -0 cat > "combined/${{ matrix.rank }}_alignment.jsonl"
          test -s "combined/${{ matrix.rank }}_alignment.jsonl"
          python scripts/bb_finalize_alignment.py \
            --alignment "combined/${{ matrix.rank }}_alignment.jsonl" \
            --out "repaired/${{ matrix.rank }}_shard_0000_alignment.jsonl" \
            --language "$language" \
            --rank "${{ matrix.rank }}" \
            --overrides configs/bb_final_unit_overrides_20260916.json \
            --report "dist/${{ matrix.rank }}_${{ matrix.key }}/${{ matrix.rank }}_repair_QA.json" \
            --require-zero-hard \
            --require-all-overrides

      - name: Assemble corrected BB REVIEW EPUB
        run: |
          if [ "${{ matrix.engine }}" = "gutenberg" ]; then script=scripts/bb_translate_gutenberg.py; else script=scripts/bb_translate_wikisource.py; fi
          python "$script" \
            --config "${{ matrix.config }}" \
            --out "dist/${{ matrix.rank }}_${{ matrix.key }}" \
            --mode assemble \
            --source-bundle "prepared/${{ matrix.rank }}/${{ matrix.rank }}_source_bundle.json" \
            --shards-dir repaired

      - name: EPUBCheck 5.2.1
        run: |
          set -o pipefail
          curl --fail --location --retry 3 -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          epub_path="$(find "dist/${{ matrix.rank }}_${{ matrix.key }}" -name '*.epub' -print -quit)"
          test -n "$epub_path"
          java -jar /tmp/epubcheck/epubcheck-5.2.1/epubcheck.jar "$epub_path" 2>&1 | tee "dist/${{ matrix.rank }}_${{ matrix.key }}/${{ matrix.rank }}_EPUBCHECK.log"

      - name: Verify archive and record SHA-256
        run: |
          epub_path="$(find "dist/${{ matrix.rank }}_${{ matrix.key }}" -name '*.epub' -print -quit)"
          unzip -t "$epub_path" > "dist/${{ matrix.rank }}_${{ matrix.key }}/${{ matrix.rank }}_ZIP_TEST.log"
          sha256sum "$epub_path" > "dist/${{ matrix.rank }}_${{ matrix.key }}/${{ matrix.rank }}_SHA256SUMS.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rank = "${{ matrix.rank }}"
          key = "${{ matrix.key }}"
          out = Path(f"dist/{rank}_{key}/{rank}_RECOVERY_PROVENANCE.json")
          out.write_text(json.dumps({
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "rank": rank,
              "source_artifact": "${{ matrix.batch_key }}-prepared-sources",
              "expected_shard_count": int("${{ matrix.shard_count }}"),
              "finalizer": "scripts/bb_finalize_alignment.py",
              "override_registry": "configs/bb_final_unit_overrides_20260916.json",
              "hard_gate": "zero",
              "epubcheck": "5.2.1",
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload corrected review EPUB and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-final3-recovered-${{ matrix.rank }}-${{ matrix.key }}-italian-review
          path: dist/${{ matrix.rank }}_${{ matrix.key }}
          if-no-files-found: error
          retention-days: 30
