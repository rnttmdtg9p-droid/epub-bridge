name: BB Mastino export review EPUB 20260917

on:
  push:
    paths:
      - ".github/workflows/bb-mastino-export-b64-20260917.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve completed review artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10479613003/zip > /tmp/mastino-review.zip
          mkdir -p /tmp/mastino-review
          unzip -q /tmp/mastino-review.zip -d /tmp/mastino-review
      - name: Stage lossless text transfer
        run: |
          epub_path="$(find /tmp/mastino-review -name '*.epub' -print -quit)"
          test -n "$epub_path"
          mkdir -p reports/_artifact_transfer
          base64 -w 0 "$epub_path" > reports/_artifact_transfer/055_mastino_review.epub.b64
          sha256sum "$epub_path" | awk '{print $1}' > reports/_artifact_transfer/055_mastino_review.epub.sha256
          wc -c "$epub_path" reports/_artifact_transfer/055_mastino_review.epub.b64
      - name: Commit transfer payload
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/_artifact_transfer/055_mastino_review.epub.b64 reports/_artifact_transfer/055_mastino_review.epub.sha256
          git commit -m "Stage Mastino review EPUB transfer"
          git push
