name: BB Russian43 proper name consistency source comparison
on:
  push:
    paths: ['.github/workflows/bb-ru43-names.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Review complete paragraph and independently compare corrected text
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 scripts/bb_ru43_names.py
      - name: Preserve actual exchanges
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru43-name-consistency-source-comparison-v5070
          path: results/ru43-names/
          retention-days: 90
          if-no-files-found: error
