name: BB16 v5.0.14 thumbnail recovery
on:
  push:
    paths:
      - '.github/workflows/bb16-v5014-thumbnails.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Acquire Commons thumbnail derivatives
        run: |
          python -m pip -q install requests pillow
          cat > /tmp/thumbs.py <<'PY'
          import requests,pathlib,json,re,time,hashlib,io
          from PIL import Image,ImageOps
          S=requests.Session();S.headers['User-Agent']='BoundaryBayEditorial/1.0 (public-domain publishing research; github.com/rnttmdtg9p-droid/epub-bridge)'
          API='https://commons.wikimedia.org/w/api.php'
          plans={
          '075_Papa_Goriot':('Illustrations de Le Père Goriot Lynch Abot',lambda t:t.startswith('File:Illustrations de Le Père Goriot')),
          '078_Certosa_di_Parma':('Chartreuse de Parme 1883 Valentin Foulquier',lambda t:'Chartreuse de Parme 1883' in t and 'Valentin Foulquier' in t),
          '081_Bel_Ami':('Maupassant Bel-ami',lambda t:t.startswith('File:Maupassant Bel-ami')),
          '082_Boule_de_suif':('Illustrations de Boule de Suif Thévenot Romagnol',lambda t:t.startswith('File:Illustrations de Boule de Suif')),
          '088_Giardino_dei_ciliegi':('The Cherry Orchard Moscow Art Theatre',lambda t:'Cherry Orchard' in t and not any(x in t.lower() for x in ['.pdf','.djvu']))}
          def api(p):
            for i in range(6):
              r=S.get(API,params=p,timeout=40)
              if r.status_code!=429:r.raise_for_status();return r.json()
              time.sleep(3+i*2)
            r.raise_for_status()
          def search(q):
            out=[];cont={}
            while len(out)<250:
              p={'action':'query','format':'json','generator':'search','gsrsearch':q,'gsrnamespace':6,'gsrlimit':50,'prop':'imageinfo','iiprop':'url|size|extmetadata','iiurlwidth':1600};p.update(cont)
              j=api(p)
              for pg in j.get('query',{}).get('pages',{}).values():
                if pg.get('imageinfo'):out.append((pg.get('title',''),pg['imageinfo'][0]))
              if 'continue' not in j:break
              cont=j['continue']
            return out
          def get(url):
            # Wikimedia explicitly requests thumbnail derivatives for bulk reuse.
            for i in range(8):
              r=S.get(url,timeout=60)
              if r.status_code==200:return r.content
              if r.status_code==429:time.sleep(3+i*2);continue
              r.raise_for_status()
            raise RuntimeError('429 after retries')
          def val(x):return re.sub('<[^>]+>',' ',str((x or {}).get('value','') if isinstance(x,dict) else x or '')).strip()
          root=pathlib.Path('assets');root.mkdir()
          for book,(q,accept) in plans.items():
            d=root/book;d.mkdir(); rec=[]
            for title,ii in search(q):
              if not accept(title):continue
              em=ii.get('extmetadata',{}) or {};lic=(val(em.get('LicenseShortName'))+' '+val(em.get('UsageTerms'))).strip(); rights='public domain' in lic.lower() or 'pd-' in val(em.get('Categories')).lower()
              row={'title':title,'descriptionurl':ii.get('descriptionurl'),'source_url':ii.get('url'),'thumburl':ii.get('thumburl'),'source_dimensions':[ii.get('width'),ii.get('height')],'license':lic,'artist':val(em.get('Artist')),'rights_pass':rights}
              if rights and ii.get('thumburl'):
                try:
                  raw=get(ii['thumburl']);im=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB');fn=re.sub(r'[^A-Za-z0-9._-]+','_',title[5:])[:170];fn=re.sub(r'\.(png|tif|tiff|gif|webp)$','.jpg',fn,flags=re.I)
                  if not fn.lower().endswith(('.jpg','.jpeg')):fn+='.jpg'
                  out=d/fn;im.save(out,'JPEG',quality=92,optimize=True,subsampling=0);row.update(file=fn,output_dimensions=list(im.size),output_sha256=hashlib.sha256(out.read_bytes()).hexdigest(),download='PASS')
                except Exception as e:row.update(download='FAIL',error=str(e))
                time.sleep(.25)
              rec.append(row)
            (d/'records.json').write_text(json.dumps({'book':book,'query':q,'records':rec},ensure_ascii=False,indent=2));print(book,'accepted',len(rec),'downloaded',sum(r.get('download')=='PASS' for r in rec),flush=True)
          PY
          python /tmp/thumbs.py
      - uses: actions/upload-artifact@v4
        with:
          name: bb16-v5014-thumbnail-assets
          path: assets
          retention-days: 14
