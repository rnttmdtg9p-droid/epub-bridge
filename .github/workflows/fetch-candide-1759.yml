name: Fetch Candido 1759 Text

on:
  push:
    paths:
      - '.github/workflows/fetch-candide-1759.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch complete public-domain Italian source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candide/evidence candide/text-segments
          ID='QD6zh3qO9w4C'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          curl -L --fail --retry 8 --retry-all-errors -A "$UA" \
            "https://play.google.com/books/reader?id=$ID&hl=en_US&pg=GBS.PA1" \
            -o candide/evidence/google-play-reader-1759.html
          curl -L --fail --retry 8 --retry-all-errors -A "$UA" \
            "https://play.google.com/store/books/details?id=$ID" \
            -o candide/evidence/google-play-store-1759.html

          python3 - <<'PY'
          import json, pathlib, subprocess, time
          root=pathlib.Path('candide')
          source=(root/'evidence/google-play-reader-1759.html').read_text()
          marker='"segment":'
          start=source.index(marker)+len(marker)
          depth=0; string=False; escaped=False; end=None
          for pos,char in enumerate(source[start:], start):
              if string:
                  if escaped: escaped=False
                  elif char=='\\': escaped=True
                  elif char=='"': string=False
              elif char=='"': string=True
              elif char=='[': depth+=1
              elif char==']':
                  depth-=1
                  if depth==0: end=pos+1; break
          segments=json.loads(source[start:end])
          segments=[s for s in segments if s['label'].startswith('chapter.')]
          hosts=['books.googleusercontent.com','books.google.it','books.google.dk','books.google.fr','books.google.de','books.google.es','books.google.co.uk','books.google.ca']
          manifest=[]
          for n,segment in enumerate(segments,1):
              link=segment['link'].replace('&amp;','&')
              saved=root/'text-segments'/f"{n:02d}_{segment['label'].replace('.','_')}.json"
              raw=None; used=None
              for attempt in range(16):
                  host=hosts[attempt%len(hosts)]
                  url='https://'+host+link
                  proc=subprocess.run(['curl','-L','--max-time','60','-sS',url],stdout=subprocess.PIPE)
                  if proc.returncode==0 and proc.stdout.lstrip().startswith(b'{'):
                      try:
                          data=json.loads(proc.stdout)
                      except json.JSONDecodeError:
                          data={}
                      if data.get('content'): raw=proc.stdout; used=url; break
                  time.sleep(2+attempt)
              if raw is None: raise SystemExit(f"Unable to retrieve {segment['label']}")
              saved.write_bytes(raw)
              manifest.append({'order':n,'label':segment['label'],'start':segment['start'],'num_pages':segment['num_pages'],'source_url':used,'saved_file':saved.name,'content_chars':len(json.loads(raw)['content'])})
              time.sleep(2)
          (root/'text-segment-manifest.json').write_text(json.dumps(manifest,indent=2))
          if len(manifest)!=21: raise SystemExit(f'Expected 21 source segments, got {len(manifest)}')
          PY

          find candide -type f -print0 | sort -z | xargs -0 sha256sum > candide/SHA256SUMS.txt
          find candide -type f | sort > candide/FILE_LIST.txt

      - name: Upload Candido source
        uses: actions/upload-artifact@v4
        with:
          name: candido-1759-text-source
          path: candide/
          compression-level: 6
          if-no-files-found: error
          retention-days: 7
