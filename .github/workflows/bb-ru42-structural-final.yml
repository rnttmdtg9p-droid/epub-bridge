name: BB Russian42 final structural source comparison repair
on:
  push:
    paths: ['.github/workflows/bb-ru42-structural-final.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Review every spelling correction and independently compare stable final text
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 scripts/bb_ru42_structural_review.py
      - name: Preserve actual source, translation, review and correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru42-final-structural-comparison-v5070
          path: results/ru42-structural-final/
          retention-days: 90
          if-no-files-found: error
