name: BB Russian rank77 initial art-caption batch004
on:
  push:
    paths: ['.github/workflows/bb-ru77-art-captions004.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bb-russian-sequential-rank77
  cancel-in-progress: false
jobs:
  initial-caption-translation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure durable caption checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -m py_compile scripts/bb_ru77_art_captions004_claude.py
      - name: Initial translation of 74 historical captions only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 scripts/bb_ru77_art_captions004_claude.py
      - name: Save caption transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru77-art-captions004
          path: results/ru77-art-captions004/
          retention-days: 90
          if-no-files-found: warn
