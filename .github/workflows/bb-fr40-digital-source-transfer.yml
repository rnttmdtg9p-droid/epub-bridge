name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr55-voltaire-moreau
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Retrieve two authentic eighteenth century Moreau L'Ingénu engravings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,datetime,time,concurrent.futures
          root=pathlib.Path('transfer')
          names=['Voltaire_-_L\'Ingénu_-_Simonet_-_Moreau.jpg','Voltaire_-_L\'Ingénu_-_Delignon_-_Moreau.jpg']
          def get(row):
              i,name=row;hashname=hashlib.md5(name.encode('utf8')).hexdigest()
              url='https://upload.wikimedia.org/wikipedia/commons/'+hashname[:1]+'/'+hashname[:2]+'/'+urllib.parse.quote(name,safe='_.-')
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBayHistoricalEtchingResearch/1.0'})
                  with urllib.request.urlopen(req,timeout=100) as resp:data=resp.read(5000000)
                  assert data.startswith(b'\xff\xd8\xff') and len(data)>50000
                  dest=root/f'Ingenu_Moreau_{i}.jpg';dest.write_bytes(data)
                  return {'i':i,'file':dest.name,'url':url,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'status':'SUCCESS'}
              except Exception as e:return {'i':i,'url':url,'status':'FAILED','error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:results=list(pool.map(get,enumerate(names,1)))
          ledger={'title':'L’Ingénu','rank':55,'artist':'Jean-Michel Moreau le Jeune; engravers Simonet and Delignon, eighteenth century','rights':'Commons public-domain mark; historical engraving U.S. publication before 1931','source':'ETH Zürich reproduction via Wikimedia Commons','status':'TRANSFER_ONLY_NOT_EPUB_RELEASE','date':datetime.datetime.now(datetime.timezone.utc).isoformat(),'files':results}
          (root/'ENGRAVINGS.json').write_text(json.dumps(ledger,ensure_ascii=False,indent=2))
          print(json.dumps(results))
          assert all(x['status']=='SUCCESS' for x in results)
          PY
      - name: Save exact eighteenth-century engraving bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr55-ingenu-moreau-illustrations
          path: transfer/
          if-no-files-found: error
          retention-days: 7
