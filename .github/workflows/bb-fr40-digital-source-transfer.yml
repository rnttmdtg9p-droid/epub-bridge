name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr40-digital-source-transfer-only
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve public 1670 Desprez Wikisource transcription and paratext
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/source
          python - <<'PY'
          import concurrent.futures,datetime,hashlib,json,pathlib,time,urllib.parse,urllib.request
          root=pathlib.Path('transfer')
          base='https://fr.wikisource.org/wiki/Pensées_(Pascal)/2e_éd._Desprez/'
          names=['Texte_entier','Préface','Approbations','Privilège','Avertissement','Index']
          def get(name):
              path=root/'source'/(name.replace('è','e').replace('é','e')+'.html')
              url=base+name
              url=urllib.parse.quote(url,safe=':/()_.-')
              err=''
              for i in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBayPublicSourceTransfer/1.0 (contact: public text archival research)'})
                      with urllib.request.urlopen(req,timeout=75) as resp: data=resp.read(2500000)
                      assert len(data)>3000 and b'Wikisource' in data
                      path.write_bytes(data)
                      return {'path':str(path.relative_to(root)),'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'status':'TRANSFERRED'}
                  except Exception as e:
                      err=f'{type(e).__name__}: {e}';time.sleep(1+i)
              return {'path':str(path.relative_to(root)),'url':url,'status':'FAILED','error':err}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: rows=list(pool.map(get,names))
          (root/'TRANSFER.json').write_text(json.dumps({'rank':47,'title':'Pensées','edition':'Desprez1670 Port-Royal second','scope':'public text only; no scans; no publication or EPUB build','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'files':rows},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False))
          assert all(x['status']=='TRANSFERRED' for x in rows), 'One or more source pages were not available'
          PY
      - name: Retain source-only download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr47-pensees-digital-text
          path: transfer/
          retention-days: 7
          if-no-files-found: error
