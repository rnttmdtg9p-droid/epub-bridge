name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr62-moliere-historical-illustration
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Acquire documented public-domain Moreau illustration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import urllib.request,hashlib,json,pathlib,datetime,time
          root=pathlib.Path('transfer')
          url='https://upload.wikimedia.org/wikipedia/commons/4/42/LeMaladeImaginaire.jpg'
          err=''
          for i in range(3):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBayPublicHistoricalIllustrationResearch/1.0'})
                  with urllib.request.urlopen(req,timeout=75) as resp: data=resp.read(3500000)
                  assert len(data)>250000 and data[:3]==b'\xff\xd8\xff'
                  (root/'Moreau_LeMaladeImaginaire.jpg').write_bytes(data)
                  status={'status':'SUCCESS','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'src_url':url,'rights_page':'https://commons.wikimedia.org/wiki/File:LeMaladeImaginaire.jpg','artist':'Jean-Michel Moreau le Jeune, drawing','printed_reproduction':'Lavergne / Molière, Paris, pre-1913','reuse':'Public Domain Mark / PD Art; US public domain','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Art only, no EPUB build or publication'}
                  break
              except Exception as e:err=repr(e);time.sleep(2+i)
          else:status={'status':'FAILED','error':err,'src_url':url}
          (root/'PROVENANCE.json').write_text(json.dumps(status,indent=2),encoding='utf-8')
          print(json.dumps(status))
          assert status['status']=='SUCCESS'
          PY
      - name: Preserve validated title-specific historical image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr62-moliere-historical-cover-source
          path: transfer/
          retention-days: 7
