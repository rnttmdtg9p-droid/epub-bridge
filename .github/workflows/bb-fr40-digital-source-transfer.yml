name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr56-zadig-historical-assets
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Retrieve Zadig Moreau 18th century original engravings from Commons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import urllib.request,time,datetime,json,hashlib,pathlib
          items=[('Triere','https://upload.wikimedia.org/wikipedia/commons/1/1d/Voltaire_-_Zadig_-_Tri%C3%A8re_-_Moreau.jpg'),('Duclos','https://upload.wikimedia.org/wikipedia/commons/1/15/Voltaire_-_Zadig_-_Duclos_-_Moreau.jpg')]
          root=pathlib.Path('transfer');rows=[]
          for name,url in items:
            error=''
            for attempt in range(3):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBayFrenchCollection/1.0 (public-domain illustration research)'})
                with urllib.request.urlopen(req,timeout=75) as r: blob=r.read(2500000)
                assert blob.startswith(b'\xff\xd8\xff') and len(blob)>100000,'incomplete jpeg'
                (root/f'Zadig_Moreau_{name}.jpg').write_bytes(blob)
                rows.append({'name':name,'url':url,'bytes':len(blob),'sha256':hashlib.sha256(blob).hexdigest(),'status':'SUCCESS'});break
              except Exception as e:error=type(e).__name__+': '+str(e);time.sleep(1+attempt*2)
            else: rows.append({'name':name,'url':url,'status':'FAILED','error':error})
          (root/'SOURCE_LEDGER.json').write_text(json.dumps({'rank':56,'title':'Zadig','original_artist':'Jean-Michel Moreau le Jeune','source':'Wikimedia Commons / ETH Zürich, engravings of Zadig in Voltaire works','original_creator':'Engravers Trière and Duclos, 18th c.','rights':'Public domain United States, Commons PD-Mark and faithful reproductions of 2D public-domain works','scope':'Source asset retrieval only; no scans, EPUB build, publication or canonical write','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'assets':rows},ensure_ascii=False,indent=2))
          assert all(x['status']=='SUCCESS' for x in rows),rows
          PY
      - name: Retain source art and rights metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr56-zadig-original-illustrations
          path: transfer/
          retention-days: 7
