name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr53-illustration-transfer-only
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve historical Commons illustrations from source-native transclusions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/images transfer/source
          python - <<'PY'
          import concurrent.futures,datetime,hashlib,json,os,pathlib,time,urllib.parse,urllib.request,html.parser
          root=pathlib.Path('transfer')
          names=['Préface']+['Livre_'+r for r in ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII']]
          base='https://fr.wikisource.org/wiki/Les_Confessions_(Rousseau)/'
          def download(name):
              err=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(urllib.parse.quote(base+name,safe=':/()_'),headers={'User-Agent':'BoundaryBaySourceIllustrationResearch/1.0'})
                      with urllib.request.urlopen(req,timeout=65) as resp:data=resp.read(1500000)
                      assert len(data)>20000
                      return {'name':name,'bytes':data,'sha256':hashlib.sha256(data).hexdigest(),'url':urllib.parse.quote(base+name,safe=':/()_')}
                  except Exception as ex:err=str(ex);time.sleep(attempt+1)
              return {'name':name,'error':err}
          class Parser(html.parser.HTMLParser):
              def __init__(self):super().__init__();self.depth=0;self.items=[];self.insource=False
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=='div' and 'prp-pages-output' in attrs.get('class',''):self.in_source=True
                  if tag=='img' and 'Launette' in attrs.get('src','') and 'Confessions' in attrs.get('src',''):
                      self.items.append({'src':attrs.get('src'),'alt':attrs.get('alt',''),'w':attrs.get('width'),'h':attrs.get('height')})
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:pages=list(pool.map(download,names))
          items=[];pagehashes=[]
          for page in pages:
              if 'bytes' not in page:continue
              d=page['bytes'];(root/'source'/(page['name']+'.html')).write_bytes(d)
              p=Parser();p.feed(d.decode('utf-8','replace'))
              pagehashes.append({'unit':page['name'],'sha256':page['sha256'],'found_image_uses':len(p.items),'url':page['url']})
              for i,img in enumerate(p.items):
                  url=urllib.parse.urljoin('https://fr.wikisource.org',img['src'])
                  parts=urllib.parse.urlsplit(url)
                  url=urllib.parse.urlunsplit((parts.scheme,parts.netloc,parts.path,'',''))
                  items.append({'unit':page['name'],'ordinal':i+1,'url':url,'alt':img['alt']})
          unique={x['url']:x for x in items}
          assert 75<=len(items)<=130,f'unexpected image count {len(items)}'
          def fetch(item):
              url=item['url'];err=''
              for n in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBaySourceIllustrationResearch/1.0'})
                      with urllib.request.urlopen(req,timeout=100) as res:data=res.read(10000000)
                      assert data.startswith((b'\x89PNG',b'\xff\xd8\xff')) and len(data)>1500,'unrecognized image format'
                      fname='images/img-'+str(len(item['url']))+'-'+hashlib.sha256(url.encode()).hexdigest()[:15]+('.png' if data.startswith(b'\x89PNG') else '.jpg')
                      (root/fname).write_bytes(data)
                      return {**item,'file':fname,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'status':'SUCCESS'}
                  except Exception as ex:err=str(ex);time.sleep(2+n)
              return {**item,'status':'FAILED','error':err}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:results=list(pool.map(fetch,unique.values()))
          report={'schema':'bb.fr53.digital-image-transfer.v1','rank':53,'source':'Launette1889 public Wikisource source transclusions, different fetch may have changed revision since frozen source','copyright_note':'Published 1889; final reuse terms and artwork-specific provenance still require review','scope':'illustration-only download, no EPUB build/promotion','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'pages':pagehashes,'image_occurrences':items,'downloaded':results}
          (root/'TRANSFER.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'pages':len(pagehashes),'occurrences':len(items),'unique':len(unique),'success':sum(x['status']=='SUCCESS' for x in results),'failed':sum(x['status']=='FAILED' for x in results),'bytes':sum(x.get('bytes',0) for x in results)}))
          PY
      - name: Retain source asset transfer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr53-historical-digital-illustrations
          path: transfer/
          retention-days: 7
          if-no-files-found: error
