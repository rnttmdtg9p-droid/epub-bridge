name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr54-engraving-recovery-only
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve outstanding original 1762 public-domain engravings by direct Commons storage path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import urllib.request,urllib.parse,hashlib,pathlib,json,time,datetime
          base='https://upload.wikimedia.org/wikipedia/commons/'
          names=[(1,'Emile I Thétis et Achille 1762.jpg'),(2,'Emile II Chiron et Achille.jpg'),(5,'Emile V Circé et Ulysse.jpg')]
          rows=[];root=pathlib.Path('transfer')
          for i,name in names:
              literal=name.replace(' ','_');md5=hashlib.md5(literal.encode('utf-8')).hexdigest()
              url=base+md5[0]+'/'+md5[:2]+'/'+urllib.parse.quote(literal,safe='_.')
              status='FAILED';error=''
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBayBookResearch/1.0','Accept':'image/jpeg'})
                      with urllib.request.urlopen(req,timeout=75) as response:data=response.read(7000000)
                      assert data.startswith(b'\xff\xd8\xff') and len(data)>30000
                      (root/f'emile-book-{i}.jpg').write_bytes(data)
                      rows.append({'book':i,'name':name,'url':url,'status':'SUCCESS','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()});status='SUCCESS';break
                  except Exception as e:error=repr(e);time.sleep(2+attempt*3)
              if status=='FAILED':rows.append({'book':i,'name':name,'url':url,'status':status,'error':error})
          (root/'LEDGER.json').write_text(json.dumps({'rank':54,'scope':'historical art only, no EPUB promotion','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':rows},ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(rows,ensure_ascii=False))
          PY
      - name: Save transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr54-original-engraving-retry
          path: transfer/
          retention-days: 7
