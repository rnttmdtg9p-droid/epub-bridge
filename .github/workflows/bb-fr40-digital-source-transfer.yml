name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr50-diderot-portrait
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Retrieve rights-evidenced Diderot public-domain historical portrait
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import urllib.request,hashlib,pathlib,json,datetime
          url='https://upload.wikimedia.org/wikipedia/commons/f/fc/Denis_Diderot_by_Louis-Michel_van_Loo.jpg'
          req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBayHistoricalPortraitResearch/1.0'})
          with urllib.request.urlopen(req,timeout=65) as r:data=r.read(3000000)
          assert data[:3]==b'\xff\xd8\xff' and len(data)>700000
          p=pathlib.Path('transfer/Denis_Diderot_Van_Loo_1767.jpg');p.write_bytes(data)
          (pathlib.Path('transfer/PROVENANCE.json')).write_text(json.dumps({'rank':50,'subject':'Denis Diderot','asset':'Louis-Michel van Loo, Diderot, 1767, Louvre RF1958','source':url,'rights_page':'https://commons.wikimedia.org/wiki/File:Denis_Diderot_by_Louis-Michel_van_Loo.jpg','rights':'Wikimedia Commons public-domain mark / PD-Art US','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}))
          PY
      - name: Retain source asset only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr50-diderot-portrait
          path: transfer/
          retention-days: 7
          if-no-files-found: error
