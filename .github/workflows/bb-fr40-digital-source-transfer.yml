name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr40-digital-source-transfer-only
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Acquire Rene digital text only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/source
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 -A 'BoundaryBaySourceTransfer/1.0 (digital text only)' 'https://fr.wikisource.org/wiki/Ren%C3%A9' -o transfer/source/Rene.html
          python - <<'PY'
          import pathlib,json,hashlib,datetime
          root=pathlib.Path('transfer')
          p=root/'source/Rene.html'
          assert p.stat().st_size>30000, 'Source transfer incomplete'
          assert 'René' in p.read_text(), 'Unexpected content'
          ledger={'scope':'digital-source-transfer-only; no scans, EPUB build, canonical state write, or publication','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source_url':'https://fr.wikisource.org/wiki/Ren%C3%A9','files':[{'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}]}
          (root/'TRANSFER.json').write_text(json.dumps(ledger,indent=2),encoding='utf-8')
          PY
      - name: Retain source transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr41-digital-source-transfer
          path: transfer/
          if-no-files-found: error
          retention-days: 7
