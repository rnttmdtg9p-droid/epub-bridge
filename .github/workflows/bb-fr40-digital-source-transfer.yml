name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr57-lafontaine-portrait
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve museum-verified CC0 La Fontaine portrait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import urllib.request,hashlib,pathlib,json,datetime
          url='https://upload.wikimedia.org/wikipedia/commons/1/17/Hyacinthe_Rigaud_-_Portrait_de_Jean_de_La_Fontaine_(1621-1695)%2C_po%C3%A8te_-_P2441_-_Mus%C3%A9e_Carnavalet.jpg'
          req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBayFrenchCollection/1.0 (public museum portrait)'})
          with urllib.request.urlopen(req,timeout=65) as resp:data=resp.read(3500000)
          assert data.startswith(b'\xff\xd8\xff') and len(data)>500000
          p=pathlib.Path('transfer/LaFontaine_Rigaud_Carnavalet_P2441.jpg');p.write_bytes(data)
          (pathlib.Path('transfer/PROVENANCE.json')).write_text(json.dumps({'rank':57,'subject':'Jean de La Fontaine','creator':'Hyacinthe Rigaud','date':'circa 1680','museum':'Musée Carnavalet, Paris, accession P2441','source':'https://commons.wikimedia.org/wiki/File:Hyacinthe_Rigaud_-_Portrait_de_Jean_de_La_Fontaine_(1621-1695),_po%C3%A8te_-_P2441_-_Mus%C3%A9e_Carnavalet.jpg','rights':'Paris Musées CC0 public-domain dedication; USA distribution','url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'scope':'source portrait only, no EPUB release'},ensure_ascii=False,indent=2))
          PY
      - name: Retain portrait with evidence
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr57-lafontaine-rigaud-portrait
          path: transfer/
          retention-days: 7
