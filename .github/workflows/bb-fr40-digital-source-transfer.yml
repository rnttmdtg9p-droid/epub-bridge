name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr40-digital-source-transfer-only
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Retrieve verified public domain Pascal author portrait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import urllib.request,hashlib,pathlib,json,datetime
          url='https://upload.wikimedia.org/wikipedia/commons/9/98/Blaise_Pascal_Versailles.JPG'
          req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBayPublicPortraitResearch/1.0 (public domain artwork)'})
          with urllib.request.urlopen(req,timeout=60) as response: data=response.read(6000000)
          assert data[:3]==b'\xff\xd8\xff' and len(data)>100000,'Wrong or incomplete JPG'
          pathlib.Path('transfer/Pascal_Versailles.jpg').write_bytes(data)
          result={'rank':47,'image_url':url,'rights_evidence_url':'https://commons.wikimedia.org/wiki/File:Blaise_Pascal_Versailles.JPG','rights':'Public Domain Mark; original painting anonymous circa1690; US public domain; faithful photographic reproduction','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'public domain source asset only; no EPUB build nor release'}
          pathlib.Path('transfer/IMAGE.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result))
          PY
      - name: Retain portrait download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr47-pascal-portrait-transfer
          path: transfer/
          retention-days: 7
          if-no-files-found: error
