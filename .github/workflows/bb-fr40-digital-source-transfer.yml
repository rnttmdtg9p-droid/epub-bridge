name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr54-erara-iiif-research-only
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Recover first-edition Emile public domain IIIF volume and plate inventories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import json,urllib.request,hashlib,pathlib,datetime
          root=pathlib.Path('transfer')
          urls=['https://www.e-rara.ch/i3f/v20/2090103/manifest','https://www.e-rara.ch/i3f/v20/2089908/manifest']
          allrows=[]
          for idx,url in enumerate(urls):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBayDigitalPublicDomainResearch/1.0'})
              with urllib.request.urlopen(req,timeout=75) as q:data=q.read(14000000)
              assert len(data)>5000
              m=json.loads(data)
              (root/f'manifest_{idx}.json').write_bytes(data)
              items=m.get('items',[]) or []
              canvases=[]
              def crawl(nodes,sequence):
                for j,node in enumerate(nodes):
                  if node.get('type')=='Canvas':
                    labs=node.get('label',{})
                    text=' '.join(' '.join(v) for v in labs.values()) if isinstance(labs,dict) else str(labs)
                    thumb=node.get('thumbnail',[])
                    canvases.append({'index':len(canvases),'sequence':sequence,'label':text[:140],'id':node.get('id',''),'thumbnail_url':thumb[0].get('id') if thumb else None})
                  if node.get('items') and node.get('type')!='Canvas':crawl(node['items'],sequence+'/'+str(j))
              crawl(items,'')
              (root/f'canvases_{idx}.json').write_text(json.dumps(canvases,ensure_ascii=False,indent=2))
              matches=[x for x in canvases if any(t in (x['label'].lower()+' '+x['id'].lower()) for t in ['front','thétis','chiron','circ','plate','gravure','orphe','planche'])]
              allrows.append({'manifest_url':url,'total_canvases':len(canvases),'top_labels':canvases[:35],'matches':matches[:55],'byte_sha256':hashlib.sha256(data).hexdigest(),'status':'SUCCESS'})
            except Exception as e:
              allrows.append({'manifest_url':url,'status':'FAILED','error':repr(e)})
          (root/'LEDGER.json').write_text(json.dumps({'rank':54,'scope':'IIIF source metadata only; no print collation or title release','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'rows':allrows},ensure_ascii=False,indent=2))
          print(json.dumps([{k:v for k,v in row.items() if k not in ['top_labels','matches']} for row in allrows]))
          PY
      - name: Retain metadata for independent plate identification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr54-erara-iiif-metadata
          path: transfer/
          retention-days: 7
