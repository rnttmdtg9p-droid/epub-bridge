name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr54-educational-frontispieces
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Retrieve five public domain 1762 Émile book-related engravings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import pathlib,urllib.parse,urllib.request,hashlib,json,datetime,concurrent.futures,time
          root=pathlib.Path('transfer')
          names=['Emile I Thétis et Achille 1762.jpg','Emile II Chiron et Achille.jpg','Emile III Hermes.jpg','Emile IV Orphée enseignant à prier.jpg','Emile V Circé et Ulysse.jpg']
          def get(pair):
              i,name=pair
              api='https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo&iiprop=url%7Cextmetadata&titles='+urllib.parse.quote('File:'+name,safe='')
              try:
                  with urllib.request.urlopen(urllib.request.Request(api,headers={'User-Agent':'BoundaryBayHistoricalIllustrationResearch/1.0'}),timeout=50) as q:data=json.load(q)
                  x=next(iter(data['query']['pages'].values()))
                  info=x['imageinfo'][0];url=info['url']
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'BoundaryBayHistoricalIllustrationResearch/1.0'}),timeout=80) as q:blob=q.read(7000000)
                  assert len(blob)>30000 and blob[:3]==b'\xff\xd8\xff'
                  dest=root/('emile-book-'+str(i)+'.jpg');dest.write_bytes(blob)
                  rights=info.get('extmetadata',{})
                  return {'book':i,'file':name,'bytes':len(blob),'sha256':hashlib.sha256(blob).hexdigest(),'commons_url':'https://commons.wikimedia.org/wiki/File:'+urllib.parse.quote(name),'asset_url':url,'license':rights.get('LicenseShortName',{}).get('value'),'artist':rights.get('Artist',{}).get('value','')[:300],'status':'SUCCESS'}
              except Exception as e:return {'book':i,'file':name,'status':'FAILED','error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:rows=list(pool.map(get,enumerate(names,1)))
          (root/'LEDGER.json').write_text(json.dumps({'rank':54,'title':'Émile, ou De l’éducation','art':'Original 1762 engraved book frontispieces as listed by Wikimedia Commons; separate from selected 1782 text source; matches book scenes, not falsely called illustrations from 1782 printing','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'assets':rows,'scope':'Source-only research, no scans, no EPUB build or release'},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False))
          assert all(x['status']=='SUCCESS' for x in rows),'Not all engravings could be acquired'
          PY
      - name: Save sourced illustration assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr54-emile-historical-book-engravings
          path: transfer/
          retention-days: 7
          if-no-files-found: error
