name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr55-voltaire-historical-portrait
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Recover National Gallery of Art CC0 portrait of Voltaire
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,datetime,time
          name='Jean-Antoine_Houdon,_Voltaire,_1778,_NGA_46715.jpg'
          md5=hashlib.md5(name.encode()).hexdigest()
          urls=['https://upload.wikimedia.org/wikipedia/commons/'+md5[0]+'/'+md5[:2]+'/'+urllib.parse.quote(name,safe='_.-,'),
          'https://commons.wikimedia.org/wiki/Special:FilePath/'+urllib.parse.quote(name,safe='_.-,')]
          rows=[];root=pathlib.Path('transfer');success=False
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBayCommonsHistoricalResearch/1.0','Accept':'image/jpeg'})
                  with urllib.request.urlopen(req,timeout=70) as r:data=r.read(3000000)
                  assert data[:3]==b'\xff\xd8\xff' and len(data)>100000
                  (root/'Voltaire_Houdon_1778_NGA_CC0.jpg').write_bytes(data)
                  rows.append({'url':url,'status':'SUCCESS','sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)});success=True;break
              except Exception as e:
                  rows.append({'url':url,'status':'FAILED','error':repr(e)})
          record={'rank':55,'title':'L’Ingénu','subject':'Voltaire','artwork':'Jean-Antoine Houdon, marble bust Voltaire 1778, NGA accession 1963.10.240','rights':'NGA open access CC0 1.0','source':'https://commons.wikimedia.org/wiki/File:Jean-Antoine_Houdon,_Voltaire,_1778,_NGA_46715.jpg','scope':'portrait-only source transfer, no EPUB build or publication','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'attempts':rows}
          (root/'PORTRAIT.json').write_text(json.dumps(record,ensure_ascii=False,indent=2))
          print(json.dumps(record,ensure_ascii=False))
          assert success,'Historical portrait byte retrieval not available'
          PY
      - name: Save original portrait and rights evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr55-voltaire-NGA-CC0-portrait
          path: transfer/
          retention-days: 7
