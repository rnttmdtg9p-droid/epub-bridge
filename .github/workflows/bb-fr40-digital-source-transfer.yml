name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-french-cover-historical-art
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover public-domain historical art for BB French cover correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/artwork
          python - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,hashlib,datetime,time
          root=pathlib.Path('transfer/artwork')
          works=[('045_Gargantua_Dore','File:Gustave Doré - Gargantua.jpg'),('048_Montesquieu_portrait','File:Charles de Secondat, Baron de Montesquieu.jpg'),('049_Persian_Letters_1759','File:Persianische Briefe.jpg')]
          rows=[]
          for label,title in works:
              q=urllib.parse.urlencode({'action':'query','titles':title,'prop':'imageinfo','iiprop':'url|size|extmetadata','format':'json'})
              api='https://commons.wikimedia.org/w/api.php?'+q
              try:
                  req=urllib.request.Request(api,headers={'User-Agent':'BoundaryBayPublicDomainResearch/1.0 (literary art source retrieval)'})
                  with urllib.request.urlopen(req,timeout=70) as r: obj=json.load(r)
                  pages=list(obj['query']['pages'].values());info=pages[0]['imageinfo'][0];url=info['url']
                  req=urllib.request.Request(url,headers={'User-Agent':'BoundaryBayPublicDomainResearch/1.0 (literary art source retrieval)'})
                  with urllib.request.urlopen(req,timeout=90) as r:data=r.read(15000000)
                  assert data[:3]==b'\xff\xd8\xff' and len(data)>20000
                  p=root/(label+'.jpg');p.write_bytes(data)
                  rows.append({'label':label,'title':title,'page':'https://commons.wikimedia.org/wiki/'+urllib.parse.quote(title.replace(' ','_'),safe=':()_'),'asset_url':url,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data),'extmetadata':{k:v.get('value','')[:600] for k,v in info.get('extmetadata',{}).items() if k in ['LicenseShortName','LicenseUrl','UsageTerms','Credit','Artist','Copyrighted','Restrictions']},'status':'PASS'})
              except Exception as e:
                  rows.append({'label':label,'title':title,'status':'FAIL','error':str(e)})
          (pathlib.Path('transfer')/'TRANSFER.json').write_text(json.dumps({'scope':'Three historic public-domain illustrative assets for title-specific cover composition; no publish or EPUB writes','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'files':rows},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False))
          assert sum(x['status']=='PASS' for x in rows)>=2,'insufficient art transfers'
          PY
      - name: Retain source images and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-french-cover-historical-art-transfer
          path: transfer/
          retention-days: 7
          if-no-files-found: error
