name: BB French digital source transfer only
on:
  push:
    paths:
      - '.github/workflows/bb-fr40-digital-source-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bb-fr40-digital-source-transfer-only
  cancel-in-progress: false
jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve digital validator regression source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/fixture
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 -A 'BoundaryBaySourceTransfer/1.0' 'https://www.gutenberg.org/ebooks/22499.txt.utf-8' -o transfer/fixture/La_crisi_Immutable_Gutenberg_22499.txt
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 -A 'BoundaryBaySourceTransfer/1.0' 'https://www.gutenberg.org/cache/epub/22499/pg22499-images.html' -o transfer/fixture/La_crisi_Immutable_Gutenberg_22499.html
          python - <<'PY'
          import pathlib,json,hashlib,datetime
          root=pathlib.Path('transfer')
          for p in (root/'fixture').iterdir():
              assert p.stat().st_size>50000
              assert 'SCENA STABILE' in p.read_text(encoding='utf-8-sig')
          ledger={'scope':'public digital validator-fixture transfer only; no scans, EPUB production, canonical writes or publication','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source_record':'https://www.gutenberg.org/ebooks/22499','files':[{'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]}
          (root/'TRANSFER.json').write_text(json.dumps(ledger,indent=2),encoding='utf-8')
          PY
      - name: Retain source fixture
        uses: actions/upload-artifact@v4
        with:
          name: bb-fr41-spatial-fixture-transfer
          path: transfer/
          if-no-files-found: error
          retention-days: 7
