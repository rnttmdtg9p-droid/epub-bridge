name: BB Russian 71 complete source aligned AI literary review
on:
  push:
    paths:
      - '.github/workflows/bb-ru71-complete-ai-review.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore every complete native DeepL source aligned unit
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40169507560
          pattern: ru71-deepl-*
          path: translation/ru71
          merge-multiple: true
      - name: Complete fidelity literary and correction verification 00 preface
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 bb-ru71-20261025/tools/review_unit71.py 0
      - name: Preserve complete review 00 before advancing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru71-reviewed-00-preface
          path: review/ru71/00-preface.json
          if-no-files-found: warn
          retention-days: 90
      - name: Complete fidelity literary and correction verification 01 chapter-01
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 bb-ru71-20261025/tools/review_unit71.py 1
      - name: Preserve complete review 01 before advancing
