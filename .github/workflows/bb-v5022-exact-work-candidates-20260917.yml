name: BB v5022 exact work illustration candidates

on:
  push:
    paths:
      - '.github/workflows/bb-v5022-exact-work-candidates-20260917.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Acquire Wikimedia Commons candidate programs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, pathlib, re, time
          import requests

          API = "https://commons.wikimedia.org/w/api.php"
          OUT = pathlib.Path("candidate-programs")
          OUT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers["User-Agent"] = "BoundaryBayEPUB/5.0.22 illustration-audit boundarybaybooks.com"

          programs = {
              "jekyll-hyde-macauley-1904":
                  "Category:Illustrations of The Strange Case of Dr Jekyll and Mr Hyde by Charles Raymond Macauley (1904)",
              "study-in-scarlet-um-crime-estrano-1905":
                  "Category:Um Crime Estrano (1905, Correio da Manha)",
          }

          def request(url, *, params=None, json_expected=False):
              last = None
              for attempt in range(12):
                  last = session.get(url, params=params, timeout=180)
                  if last.ok and (not json_expected or last.headers.get("content-type", "").startswith("application/json")):
                      return last
                  wait = max(int(last.headers.get("retry-after", "0") or 0), min(60, 3 * (attempt + 1)))
                  print("retry", last.status_code, wait, last.url)
                  time.sleep(wait)
              raise RuntimeError(f"request failed: {last.status_code} {last.url} {last.text[:200]}")

          def records(category):
              found, cont = [], {}
              while True:
                  params = {
                      "action": "query", "format": "json", "formatversion": "2",
                      "generator": "categorymembers", "gcmtitle": category,
                      "gcmtype": "file", "gcmlimit": "50",
                      "prop": "imageinfo", "iiprop": "url|mime|size|extmetadata",
                  }
                  params.update(cont)
                  data = request(API, params=params, json_expected=True).json()
                  for page in data.get("query", {}).get("pages", []):
                      info = (page.get("imageinfo") or [{}])[0]
                      found.append({"title": page.get("title"), "category": category, "imageinfo": info})
                  cont = data.get("continue") or {}
                  if not cont:
                      return found
                  time.sleep(3)

          for slug, category in programs.items():
              dest = OUT / slug
              dest.mkdir(exist_ok=True)
              recs = records(category)
              for idx, rec in enumerate(recs, 1):
                  title = rec["title"]
                  url = rec["imageinfo"].get("url")
                  if not url:
                      continue
                  safe = re.sub(r"[^A-Za-z0-9._-]+", "_", title.removeprefix("File:"))[:150]
                  response = request(url)
                  (dest / f"{idx:03d}_{safe}").write_bytes(response.content)
                  time.sleep(3)
              (dest / "provenance.json").write_text(
                  json.dumps({"category": category, "files": recs}, ensure_ascii=False, indent=2),
                  encoding="utf-8")
              print(slug, len(recs))
          PY
          find candidate-programs -type f -print0 | sort -z | xargs -0 sha256sum > candidate-programs/SHA256SUMS.txt

      - name: Upload candidates and provenance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb-v5022-exact-work-candidates
          path: candidate-programs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
