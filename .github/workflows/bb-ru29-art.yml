name: Recover historical rank29 illustrations
on:
  push:
    paths: ['.github/workflows/bb-ru29-art.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/ru29-art.py
      - name: Preserve sources
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ru29-art/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save historical rank29 illustrations"
          git pull --rebase origin main
          git push origin HEAD:main
