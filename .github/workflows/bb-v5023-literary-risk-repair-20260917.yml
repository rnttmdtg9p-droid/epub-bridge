name: BB v5.0.23 translated EPUB literary-risk repair 20260917

on:
  push:
    paths:
      - ".github/workflows/bb-v5023-literary-risk-repair-20260917.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bb-v5023-literary-risk-repair-20260917
  cancel-in-progress: false

jobs:
  repair:
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: en
            ranks: "043,044,046,047,049,050,054,055,058,059"
            artifacts: "10433572596 10408871539 10408667598 10417279945 10432619947 10468713475 10417895159"
          - language: fr
            ranks: "070,074,075,078,079,081,082"
            artifacts: "10408791146 10407854972 10409160124 10408980745 10416170390 10407539642"
          - language: de
            ranks: "085,090,091,092"
            artifacts: "10417295425 10408606826 10418125413"
          - language: ru
            ranks: "061,063,064,065,087,088,089"
            artifacts: "10468694881 10435059960 10469221277 10408876160 10408682033 10408846472"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Marian runtime
        run: |
          python -m pip install --quiet 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers==4.56.2' 'sentencepiece==0.2.1' 'sacremoses==0.1.1'

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bb-v5023-marian-${{ matrix.language }}-it-transformers-4.56.2-v1

      - name: Download immutable alignment artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_IDS: ${{ matrix.artifacts }}
        run: |
          mkdir -p inputs
          for id in $ARTIFACT_IDS; do
            mkdir -p "inputs/$id"
            curl --fail --location --retry 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip" \
              -o "inputs/$id.zip"
            unzip -q "inputs/$id.zip" -d "inputs/$id"
          done

      - name: Download prior source-bound correction ledgers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p existing-corrections
          for id in 10516366248 10515224982; do
            mkdir -p "existing-corrections/$id"
            curl --fail --location --retry 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip" \
              -o "existing-corrections/$id.zip"
            unzip -q "existing-corrections/$id.zip" -d "existing-corrections/$id"
          done

      - name: Repair evidenced high-risk units
        run: >-
          python scripts/bb_literary_risk_repair_v5023.py
          --inputs inputs
          --fallback inputs-v5023/fallback-candidates.json.gz.b64
          --existing-corrections existing-corrections
          --language "${{ matrix.language }}"
          --ranks "${{ matrix.ranks }}"
          --out "dist/${{ matrix.language }}"

      - name: Upload correction ledger and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-v5023-literary-risk-repair-${{ matrix.language }}-20260917
          path: dist/${{ matrix.language }}
          if-no-files-found: error
          retention-days: 30

