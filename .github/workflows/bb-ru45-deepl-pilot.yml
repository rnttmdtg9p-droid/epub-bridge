name: BB Russian 45 DeepL full story pilot
on:
  push:
    paths:
      - '.github/workflows/bb-ru45-deepl-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Translate full first story with original context
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,sys,gzip,base64,hashlib,re
          from pathlib import Path
          data=json.loads(gzip.decompress(base64.b64decode("")))
          out=Path("translation");out.mkdir()
          key=os.environ.get("DEEPL_AUTH_KEY","").strip()
          if not key: raise SystemExit("MISSING_DEEPL_AUTH_KEY")
          host="https://api-free.deepl.com" if key.endswith(":fx") else "https://api.deepl.com"
          def call(path,payload=None):
              req=urllib.request.Request(host+path,data=json.dumps(payload).encode() if payload is not None else None,headers={"Authorization":"DeepL-Auth-Key "+key,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:return json.load(r)
              except urllib.error.HTTPError as e:raise SystemExit("DEEPL_HTTP_ERROR_"+str(e.code))
              except Exception as e:raise SystemExit("DEEPL_NETWORK_ERROR_"+type(e).__name__)
          usage=call("/v2/usage")
          paras=data["paragraphs"]
          needed=sum(len(p["source"]) for p in paras)
          if usage.get("character_limit",0)>0 and usage.get("character_count",0)+needed>usage["character_limit"]:raise SystemExit("INSUFFICIENT_REMAINING_CHARACTER_QUOTA")
          data["engine"]="DeepL quality_optimized EN-RU"
          data["review"]="AUTOMATIC_DRAFT_REQUIRES_SOURCE_ALIGNED_REVIEW"
          for start in range(0,len(paras),8):
              batch=paras[start:start+8]
              context="Arthur Conan Doyle, A Scandal in Bohemia, narrated by Dr Watson. Victorian detective fiction. Preserve all details and dialogue. Sherlock Holmes: Шерлок Холмс; Watson: Ватсон; Irene Adler: Ирен Адлер. Surrounding original passage:\n"+"\n\n".join(p["source"] for p in paras[max(0,start-3):min(len(paras),start+11)])
              result=call("/v2/translate",{"text":[p["source"] for p in batch],"source_lang":"EN","target_lang":"RU","model_type":"quality_optimized","context":context})
              rows=result.get("translations",[])
              if len(rows)!=len(batch):raise SystemExit("PARAGRAPH_COUNT_MISMATCH")
              for p,row in zip(batch,rows):
                  target=row.get("text","").strip()
                  if not target:raise SystemExit("EMPTY_TRANSLATION")
                  p.update(target=target,target_sha256=hashlib.sha256(target.encode()).hexdigest(),model_type_used=row.get("model_type_used"))
              (out/"01.json").write_text(json.dumps(data,ensure_ascii=False,indent=2))
              print("TRANSLATED_PARAGRAPHS",min(start+8,len(paras)),flush=True)
          assert all(p.get("target") for p in paras)
          print("PILOT_COMPLETE",len(paras))
          for i in [2,3,4,32,137,174,250,262]:
              p=paras[i-1];print("SAMPLE "+json.dumps(p,ensure_ascii=False))
          
          PY
      - name: Preserve paragraph aligned translation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru45-deepl-story01
          path: translation/
          if-no-files-found: warn
          retention-days: 30
