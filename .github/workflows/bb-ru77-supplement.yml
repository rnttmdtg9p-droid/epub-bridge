name: BB Russian rank77 image-only source supplement
on:
  push:
    paths: ['.github/workflows/bb-ru77-supplement.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bb-russian-sequential-rank77
  cancel-in-progress: false
jobs:
  supplemental-initial-translation:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Configure durable supplemental checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -m py_compile scripts/bb_ru77_supplement_claude.py
      - name: Translate recovered newspaper, circular and price table
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 scripts/bb_ru77_supplement_claude.py
      - name: Save supplemental translation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru77-image-only-source-supplement
          path: results/ru77-supplement/
          retention-days: 90
          if-no-files-found: warn
