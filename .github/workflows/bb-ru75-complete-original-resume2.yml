name: BB Russian 75 complete verified original DeepL translation
on:
  push:
    paths:
      - '.github/workflows/bb-ru75-complete-original-resume2.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: bb-ru75-complete-original
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Bind accepted complete original source
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,base64,gzip,hashlib
          root=Path('bb-ru75-20261025');gate=json.loads((root/'075_Original_Source_Acceptance.json').read_text())
          assert gate['state']=='PASS_VERIFIED_ORIGINAL_COMPLETE_EXTENT_AND_REUSE_BASIS'
          packed=base64.b64decode((root/'source-units.json.gz.b64').read_text());assert hashlib.sha256(packed).hexdigest()=='222c58cb97f22e3fcc14b393cb18e31bc6b2739824e0edc95a5688a02340e6fe'
          data=json.loads(gzip.decompress(packed));assert len(data)==45 and sum(len(d['unit']['rows']) for d in data)==2905
          (root/'source').mkdir(exist_ok=True)
          for i,d in enumerate(data):(root/'source'/f'{i:02}.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          PYCODE
      - name: Restore all preserved rank75 responses before continuation
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40229728763
          pattern: ru75-deepl-*
          path: translation/ru75
          merge-multiple: true
      - name: Translate authenticated unit 00 front-matter
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        run: python3 bb-ru75-20261025/tools/translate_unit75.py 0
      - name: Preserve aligned unit 00 before advancing
        if: always()
        uses: actions/upload-artifact@v4
        with:
