name: BB French Claude API translation test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bb-fr06-claude-pilot.yml'

permissions:
  contents: read

jobs:
  translate-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Translate rank 5 chapter one from exact Russian source
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/fr05-claude-chapter1
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          API_VERSION = "2023-06-01"
          MODEL = "claude-sonnet-5-5"
          ENDPOINT = "https://api.anthropic.com/v1/messages"
          SOURCE_EPUB_SHA256 = "551059eb41f8e77f7679d9c7ad25fb40818cd6ec5f7fd4e64d0a2d10affa9da8"
          SOURCE_XHTML_SHA256 = "f591ba5a46307567843f2dee70905b41538a9d8fa08cd8a853328ff05d27a84a"
          SOURCE_LIBRARY_FILE_ID = "libfile_eec73d06c2e08191a57bcd851bdc3f6b"

          source_rows = [
              {
                  "id": "u002-p0001",
                  "source_sha256": "4bd11806284761af7543d49fc39be7f46c6254b422c66561a9c9184cd7fdd52d",
                  "source": "Алексей Федорович Карамазов был третьим сыном помещика нашего уезда Федора Павловича Карамазова, столь известного в свое время (да и теперь еще у нас припоминаемого) по трагической и темной кончине своей, приключившейся ровно тринадцать лет назад и о которой сообщу в своем месте. Теперь же скажу об этом «помещике» (как его у нас называли, хотя он всю жизнь совсем почти не жил в своем поместье) лишь то, что это был странный тип, довольно часто, однако, встречающийся, именно тип человека не только дрянного и развратного, но вместе с тем и бестолкового, — но из таких, однако, бестолковых, которые умеют отлично обделывать свои имущественные делишки, и только, кажется, одни эти. Федор Павлович, например, начал почти что ни с чем, помещик он был самый маленький, бегал обедать по чужим столам, норовил в приживальщики, а между тем в момент кончины его у него оказалось до ста тысяч рублей чистыми деньгами. И в то же время он все-таки всю жизнь свою продолжал быть одним из бестолковейших сумасбродов по всему нашему уезду. Повторю еще: тут не глупость; большинство этих сумасбродов довольно умно и хитро, — а именно бестолковость, да еще какая-то особенная, национальная.",
              },
              {
                  "id": "u002-p0002",
                  "source_sha256": "853a66c946ed8acc794d34067a15628d6b7ff85e63866d544e780dc789991e8d",
                  "source": "Он был женат два раза, и у него было три сына: старший, Дмитрий Федорович, от первой супруги, а остальные два, Иван и Алексей, от второй. Первая супруга Федора Павловича была из довольно богатого и знатного рода дворян Миусовых, тоже помещиков нашего уезда. Как именно случилось, что девушка с приданым, да еще красивая и, сверх того, из бойких умниц, столь нередких у нас в теперешнее поколение, но появлявшихся уже и в прошлом, могла выйти замуж за такого ничтожного «мозгляка», как все его тогда называли, объяснять слишком не стану. Ведь знал же я одну девицу, еще в запрошлом «романтическом» поколении, которая после нескольких лет загадочной любви к одному господину, за которого, впрочем, всегда могла выйти замуж самым спокойным образом, кончила, однако же, тем, что сама навыдумала себе непреодолимые препятствия и в бурную ночь бросилась с высокого берега, похожего на утес, в довольно глубокую и быструю реку и погибла в ней решительно от собственных капризов, единственно из-за того, чтобы походить на шекспировскую Офелию, и даже так, что будь этот утес, столь давно ею намеченный и излюбленный, не столь живописен, а будь на его месте лишь прозаический плоский берег, то самоубийства, может быть, не произошло бы вовсе. Факт этот истинный, и надо думать, что в нашей русской жизни, в два или три последние поколения, таких или однородных с ним фактов происходило немало. Подобно тому и поступок Аделаиды Ивановны Миусовой был без сомнения отголоском чужих веяний и тоже пленной мысли раздражением. Ей, может быть, захотелось заявить женскую самостоятельность, пойти против общественных условий, против деспотизма своего родства и семейства, а услужливая фантазия убедила ее, положим, на один только миг, что Федор Павлович, несмотря на свой чин приживальщика, все-таки один из смелейших и насмешливейших людей той, переходной ко всему лучшему, эпохи, тогда как он был только злой шут, и больше ничего. Пикантное состояло еще и в том, что дело обошлось увозом, а это очень прельстило Аделаиду Ивановну. Федор же Павлович на все подобные пассажи был даже и по социальному своему положению весьма тогда подготовлен, ибо страстно желал устроить свою карьеру хотя чем бы то ни было; примазаться же к хорошей родне и взять приданое было очень заманчиво. Что же до обоюдной любви, то ее вовсе, кажется, не было — ни со стороны невесты, ни с его стороны, несмотря даже на красивость Аделаиды Ивановны. Так что случай этот был, может быть, единственным в своем роде в жизни Федора Павловича, сладострастнейшего человека во всю свою жизнь, в один миг готового прильнуть к какой угодно юбке, только бы та его поманила. А между тем одна только эта женщина не произвела в нем со страстной стороны никакого особенного впечатления.",
              },
              {
                  "id": "u002-p0003",
                  "source_sha256": "acab14b068789b6cf5551089eeb6772c7acc67e880f071788a5e38558ba2d05b",
                  "source": "Аделаида Ивановна, тотчас же после увоза, мигом разглядела, что мужа своего она только презирает и больше ничего. Таким образом, следствия брака обозначились с чрезвычайною быстротой. Несмотря на то что семейство даже довольно скоро примирилось с событием и выделило беглянке приданое, между супругами началась самая беспорядочная жизнь и вечные сцены. Рассказывали, что молодая супруга выказала при том несравненно более благородства и возвышенности, нежели Федор Павлович, который, как известно теперь, подтибрил у нее тогда же, разом, все ее денежки, до двадцати пяти тысяч, только что она их получила, так что тысячки эти с тех пор решительно как бы канули для нее в воду. Деревеньку же и довольно хороший городской дом, которые тоже пошли ей в приданое, он долгое время и изо всех сил старался перевести на свое имя чрез совершение какого-нибудь подходящего акта и наверно бы добился того из одного, так сказать, презрения и отвращения к себе, которое он возбуждал в своей супруге ежеминутно своими бесстыдными вымогательствами и вымаливаниями, из одной ее душевной усталости, только чтоб отвязался. Но, к счастию, вступилось семейство Аделаиды Ивановны и ограничило хапугу. Положительно известно, что между супругами происходили нередкие драки, но, по преданию, бил не Федор Павлович, а била Аделаида Ивановна, дама горячая, смелая, смуглая, нетерпеливая, одаренная замечательною физическою силой. Наконец она бросила дом и сбежала от Федора Павловича с одним погибавшим от нищеты семинаристом-учителем, оставив Федору Павловичу на руках трехлетнего Митю. Федор Павлович мигом завел в доме целый гарем и самое забубённое пьянство, а в антрактах ездил чуть не по всей губернии и слезно жаловался всем и каждому на покинувшую его Аделаиду Ивановну, причем сообщал такие подробности, которые слишком бы стыдно было сообщать супругу о своей брачной жизни. Главное, ему как будто приятно было и даже льстило разыгрывать пред всеми свою смешную роль обиженного супруга и с прикрасами даже расписывать подробности о своей обиде. «Подумаешь, что вы, Федор Павлович, чин получили, так вы довольны, несмотря на всю вашу горесть», — говорили ему насмешники. Многие даже прибавляли, что он рад явиться в подновленном виде шута и что нарочно, для усиления смеха, делает вид, что не замечает своего комического положения. Кто знает впрочем, может быть, было это в нем и наивно. Наконец ему удалось открыть следы своей беглянки. Бедняжка оказалась в Петербурге, куда перебралась с своим семинаристом и где беззаветно пустилась в самую полную эмансипацию. Федор Павлович немедленно захлопотал и стал собираться в Петербург, — для чего? — он, конечно, и сам не знал. Право, может быть, он бы тогда и поехал; но, предприняв такое решение, тотчас же почел себя в особенном праве, для бодрости, пред дорогой, пуститься вновь в самое безбрежное пьянство. И вот в это-то время семейством его супруги получилось известие о смерти ее в Петербурге. Она как-то вдруг умерла, где-то на чердаке, по одним сказаниям — от тифа, а по другим — будто бы с голоду. Федор Павлович узнал о смерти своей супруги пьяный; говорят, побежал по улице и начал кричать, в радости воздевая руки к небу: «Ныне отпущаеши», а по другим — плакал навзрыд как маленький ребенок, и до того, что, говорят, жалко даже было смотреть на него, несмотря на всё к нему отвращение. Очень может быть, что было и то, и другое, то есть что и радовался он своему освобождению, и плакал по освободительнице — всё вместе. В большинстве случаев люди, даже злодеи, гораздо наивнее и простодушнее, чем мы вообще о них заключаем. Да и мы сами тоже.",
              },
          ]

          for row in source_rows:
              actual = hashlib.sha256(row["source"].encode("utf-8")).hexdigest()
              if actual != row["source_sha256"]:
                  raise SystemExit("SOURCE_HASH_MISMATCH:" + row["id"])

          key = os.environ.get("ANTHROPIC_API_KEY", "").strip()
          if not key:
              raise SystemExit("CLAUDE_PILOT: MISSING_ANTHROPIC_API_KEY")

          system = (
              "You are translating Fyodor Dostoevsky's The Brothers Karamazov from the "
              "provided Russian source into substantive, publication-quality modern French. "
              "Preserve meaning, tone, paragraph boundaries, names, dialogue punctuation, and "
              "every source detail. Do not summarize, omit, add commentary, or modernize facts. "
              "Return only a JSON array. Each object must contain exactly id, source_sha256, and french."
          )
          prompt = (
              "Translate the complete Chapter I, 'Fyodor Pavlovich Karamazov', in these three "
              "source-aligned paragraphs. Copy each id and source_sha256 "
              "unchanged.\n" + json.dumps(source_rows, ensure_ascii=False)
          )
          request_body = {
              "model": MODEL,
              "max_tokens": 8000,
              "system": system,
              "messages": [{"role": "user", "content": prompt}],
          }
          request_bytes = json.dumps(request_body, ensure_ascii=False).encode("utf-8")
          request_sha256 = hashlib.sha256(request_bytes).hexdigest()
          headers = {
              "x-api-key": key,
              "anthropic-version": API_VERSION,
              "content-type": "application/json",
          }
          workspace_id = os.environ.get("ANTHROPIC_WORKSPACE_ID", "").strip()
          if workspace_id:
              headers["anthropic-workspace-id"] = workspace_id
          request = urllib.request.Request(
              ENDPOINT,
              data=request_bytes,
              headers=headers,
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  api_response = json.load(response)
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              safe_body = body.replace(key, "[REDACTED]")
              error_output = Path("staging/fr05-claude-chapter1/api_error.json")
              error_output.write_text(safe_body + "\n", encoding="utf-8")
              try:
                  error_payload = json.loads(safe_body)
                  error_type = error_payload.get("error", {}).get("type", "unknown")
                  error_message = error_payload.get("error", {}).get("message", "unknown")
              except json.JSONDecodeError:
                  error_type = "non_json_error"
                  error_message = safe_body[:500]
              print("CLAUDE_PILOT: HTTP_ERROR", error.code, error_type, error_message)
              raise SystemExit(1)
          except Exception as error:
              print("CLAUDE_PILOT: NETWORK_ERROR", type(error).__name__)
              raise SystemExit(1)

          text_blocks = [
              block.get("text", "")
              for block in api_response.get("content", [])
              if block.get("type") == "text"
          ]
          raw_text = "\n".join(text_blocks).strip()
          fenced = re.fullmatch(r"```(?:json)?\s*(.*?)\s*```", raw_text, flags=re.S | re.I)
          if fenced:
              raw_text = fenced.group(1).strip()
          try:
              translated_rows = json.loads(raw_text)
          except json.JSONDecodeError:
              raise SystemExit("CLAUDE_PILOT: NON_JSON_RESPONSE")

          expected = {row["id"]: row for row in source_rows}
          if not isinstance(translated_rows, list) or len(translated_rows) != len(source_rows):
              raise SystemExit("CLAUDE_PILOT: PARAGRAPH_COUNT_MISMATCH")
          seen = set()
          evidence_rows = []
          for translated in translated_rows:
              if not isinstance(translated, dict) or set(translated) != {"id", "source_sha256", "french"}:
                  raise SystemExit("CLAUDE_PILOT: OUTPUT_SCHEMA_MISMATCH")
              unit_id = translated["id"]
              if unit_id not in expected or unit_id in seen:
                  raise SystemExit("CLAUDE_PILOT: OUTPUT_ID_MISMATCH")
              if translated["source_sha256"] != expected[unit_id]["source_sha256"]:
                  raise SystemExit("CLAUDE_PILOT: SOURCE_HASH_NOT_PRESERVED")
              french = translated["french"].strip()
              if not french:
                  raise SystemExit("CLAUDE_PILOT: EMPTY_TRANSLATION")
              if re.search(r"[А-Яа-яЁё]", french):
                  raise SystemExit("CLAUDE_PILOT: CYRILLIC_REMAINS")
              seen.add(unit_id)
              evidence_rows.append({
                  "id": unit_id,
                  "source_sha256": expected[unit_id]["source_sha256"],
                  "translation_sha256": hashlib.sha256(french.encode("utf-8")).hexdigest(),
                  "french": french,
              })

          evidence = {
              "status": "API_EXECUTION_PASS_LITERARY_REVIEW_PENDING",
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "title_rank": 5,
              "title": "Les Frères Karamazov",
              "source_language": "ru",
              "target_language": "fr",
              "source_epub_sha256": SOURCE_EPUB_SHA256,
              "source_library_file_id": SOURCE_LIBRARY_FILE_ID,
              "source_xhtml_sha256": SOURCE_XHTML_SHA256,
              "source_unit": 2,
              "chapter_number": "I",
              "chapter_title_source": "Фёдор Павлович Карамазов",
              "chapter_title_french": "Fiodor Pavlovitch Karamazov",
              "endpoint": ENDPOINT,
              "api_version": API_VERSION,
              "requested_model": MODEL,
              "response_model": api_response.get("model"),
              "response_id": api_response.get("id"),
              "stop_reason": api_response.get("stop_reason"),
              "request_sha256": request_sha256,
              "usage": api_response.get("usage", {}),
              "rows": evidence_rows,
          }
          output = Path("staging/fr05-claude-chapter1/chapter1_result.json")
          output.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          readback = output.read_bytes()
          json.loads(readback)
          print("CLAUDE_PILOT: API_EXECUTION_PASS_LITERARY_REVIEW_PENDING")
          print("CLAUDE_PILOT: RESPONSE_MODEL", evidence["response_model"])
          print("CLAUDE_PILOT: RESPONSE_ID", evidence["response_id"])
          print("CLAUDE_PILOT: PARAGRAPHS", len(evidence_rows))
          print("CLAUDE_PILOT: EVIDENCE_SHA256", hashlib.sha256(readback).hexdigest())
          PY

      - name: Preserve private staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr05-claude-api-chapter1
          path: staging/fr05-claude-chapter1/
          if-no-files-found: warn
          retention-days: 7
