name: BB Claude translation — Russian rank 35
on:
  workflow_dispatch:
  push:
    branches: [bb-russian-r035-claude-20261014]
    paths: ['.github/workflows/bb-fr06-claude-pilot.yml']
permissions:
  contents: read
concurrency:
  group: bb-russian-r035-claude
  cancel-in-progress: false
jobs:
  translate-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Translate frozen White Fang English source into Russian
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Rank35 payload for the existing Claude Actions route; no EPUB builder."""
          import os,json,hashlib,re,html,datetime,urllib.request,urllib.error
          from html.parser import HTMLParser
          from pathlib import Path
          from xml.etree import ElementTree as E
          ROOT=Path('staging/ru035-claude');ROOT.mkdir(parents=True,exist_ok=True)
          H=lambda b:hashlib.sha256(b).hexdigest()
          SOURCE_URL='https://www.gutenberg.org/cache/epub/910/pg910-images.html'
          EXPECTED_SOURCE_SHA256='61fe806d6ea3aa6e4b2bef4e2712b30f1381f03d62ca8c04cdbae83d66807208'
          MODEL='claude-sonnet-5-5'
          INLINE={'i','em','b','strong','sup','sub','br'}
          class SourceParser(HTMLParser):
           def __init__(self):super().__init__(convert_charrefs=True);self.active=False;self.stop=False;self.tag=None;self.bits=[];self.blocks=[]
           def handle_starttag(self,tag,attrs):
            a=dict(attrs)
            if a.get('id') in {'pg-footer','pg-end-separator'}:self.stop=True
            if self.stop:return
            if self.tag:
             if tag in INLINE:self.bits.append('<br/>' if tag=='br' else '<'+tag+'>')
            elif tag in {'h2','h3','p'}:self.tag=tag;self.bits=[]
           def handle_endtag(self,tag):
            if self.stop:return
            if tag==self.tag:
             markup=''.join(self.bits).strip();plain=html.unescape(re.sub('<[^>]+>','',markup));plain=' '.join(plain.split())
             if tag=='h2' and re.fullmatch('PART [IVX]+',plain):self.active=True
             if self.active and plain:self.blocks.append({'kind':tag,'source':plain,'source_xhtml':markup})
             self.tag=None;self.bits=[]
            elif self.tag and tag in INLINE and tag!='br':self.bits.append('</'+tag+'>')
           def handle_data(self,s):
            if self.tag and not self.stop:self.bits.append(html.escape(s,quote=False))
          def atomic(path,value):
           temp=path.with_suffix(path.suffix+'.writing');temp.write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');temp.replace(path)
          def main():
           key=os.environ.get('ANTHROPIC_API_KEY','').strip()
           if not key:raise RuntimeError('MISSING_ANTHROPIC_API_KEY')
           source=urllib.request.urlopen(SOURCE_URL,timeout=90).read();assert H(source)==EXPECTED_SOURCE_SHA256,'SOURCE_VERSION_CHANGED';(ROOT/'pg910_source.html').write_bytes(source)
           parser=SourceParser();parser.feed(source.decode('utf-8-sig'));blocks=parser.blocks;parts=[b for b in blocks if b['kind']=='h2'];chapters=[b for b in blocks if b['kind']=='h3'];assert len(parts)==5 and len(chapters)==25,(len(parts),len(chapters));assert blocks[2]['source'].startswith('Dark spruce forest'),blocks[:3];assert 'sun' in blocks[-1]['source'].lower() and 'pupp' in blocks[-1]['source'].lower(),blocks[-1]['source']
           part=chapter=paragraph=0;rows=[];counts=[]
           for b in blocks:
            if b['kind']=='h2':
             if part:counts.append(chapter)
             part+=1;chapter=0
            if b['kind']=='h3':chapter+=1;paragraph=0
            if b['kind']=='p':paragraph+=1
            assert b['kind'] in {'h2','h3','p'}
            b.update(id=f'part{part:02}-chapter{chapter:02}-{b["kind"]}-{paragraph:04}',part=part,chapter=chapter,source_sha256=H(b['source'].encode()),source_xhtml_sha256=H(b['source_xhtml'].encode()));rows.append(b)
           counts.append(chapter);assert counts==[3,5,6,6,5],counts
           assert len({b['id'] for b in rows})==len(rows)
           frozen={'rank':35,'title':'White Fang','source_url':SOURCE_URL,'source_sha256':H(source),'source_language':'en','target_language':'ru','parts':5,'chapters':25,'paragraphs':sum(b['kind']=='p' for b in rows),'rows':rows};atomic(ROOT/'source_ledger.json',frozen);print('CLAUDE_SOURCE_FROZEN',len(rows),H(source),flush=True)
           batches=[];current=[];size=0
           for row in rows:
            n=len(row['source_xhtml'])
            if current and (size+n>6500 or len(current)>=18):batches.append(current);current=[];size=0
            current.append(row);size+=n
           if current:batches.append(current)
           results=[]
           for ordinal,batch in enumerate(batches,1):
            system='Translate Jack London White Fang from the provided complete English source into publication-quality modern Russian. Preserve every detail, narrative voice, dialogue, paragraph boundary and source order. No abridgment, added explanations or imitation of an existing Russian translation. Translate headings too, retaining their chapter/part numbers. Preserve source meaningful inline emphasis using only i,em,b,strong,sup,sub,br XHTML tags with no attributes. Return only a JSON array with exactly id,source_sha256,russian_xhtml for each supplied row. Copy IDs and source hashes unchanged. No source omissions. White Fang is Белый Клык; Grey Beaver is Серый Бобр; Weedon Scott is Уидон Скотт; Beauty Smith is Красавчик Смит; Collie is Колли; One Eye is Одноглазый; Lip-lip is Лип-Лип; Bill is Билл and Henry is Генри.'
            body={'model':MODEL,'max_tokens':12000,'system':system,'messages':[{'role':'user','content':'Translate only these source rows, in exactly this order:\n'+json.dumps(batch,ensure_ascii=False)}]};request_bytes=json.dumps(body,ensure_ascii=False).encode();headers={'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json'}
            workspace=os.environ.get('ANTHROPIC_WORKSPACE_ID','').strip()
            if workspace:headers['anthropic-workspace-id']=workspace
            req=urllib.request.Request('https://api.anthropic.com/v1/messages',data=request_bytes,headers=headers,method='POST')
            try:
             with urllib.request.urlopen(req,timeout=240) as response:receipt=json.load(response)
            except urllib.error.HTTPError as e:
             safe=e.read().decode(errors='replace').replace(key,'[REDACTED]');atomic(ROOT/'api_error.json',{'http_status':e.code,'body':safe});raise RuntimeError('CLAUDE_HTTP_'+str(e.code)) from None
            atomic(ROOT/f'receipt-{ordinal:04}.json',receipt)
            assert receipt.get('stop_reason')=='end_turn','TRUNCATED_OR_NONFINAL_RESPONSE'
            text='\n'.join(x.get('text','') for x in receipt.get('content',[]) if x.get('type')=='text').strip();fence=re.fullmatch(r'```(?:json)?\s*(.*?)\s*```',text,re.S|re.I)
            if fence:text=fence[1]
            translated=json.loads(text);assert isinstance(translated,list) and len(translated)==len(batch),'ROW_COUNT_MISMATCH'
            for original,target in zip(batch,translated):
             assert set(target)=={'id','source_sha256','russian_xhtml'} and target['id']==original['id'] and target['source_sha256']==original['source_sha256'],'SOURCE_BINDING_MISMATCH'
             element=E.fromstring('<p>'+target['russian_xhtml']+'</p>');assert all(e.tag in INLINE and not e.attrib for e in list(element.iter())[1:]),'UNEXPECTED_MARKUP';plain=''.join(element.itertext()).strip();assert plain and re.search('[А-Яа-яЁё]',plain),'NO_RUSSIAN_TRANSLATION'
             source_tags=re.findall(r'<(i|em|b|strong|sup|sub)(?:\s|>)',original['source_xhtml']);target_tags=re.findall(r'<(i|em|b|strong|sup|sub)(?:\s|>)',target['russian_xhtml']);assert source_tags==target_tags,'INLINE_EMPHASIS_MISMATCH';target.update(translation_sha256=H(target['russian_xhtml'].encode()),response_id=receipt.get('id'),response_model=receipt.get('model'))
            evidence={'rank':35,'batch':ordinal,'batches':len(batches),'source_sha256':H(source),'request_sha256':H(request_bytes),'response_id':receipt.get('id'),'response_model':receipt.get('model'),'usage':receipt.get('usage'),'rows':translated,'state':'TRANSLATED_SCHEMA_VALIDATED_COMPLETE_SOURCE_ALIGNED_REVIEW_PENDING'};atomic(ROOT/f'batch-{ordinal:04}.json',evidence);results+=translated;atomic(ROOT/'translation_progress.json',{'rank':35,'completed_batches':ordinal,'total_batches':len(batches),'translated_rows':len(results),'expected_rows':len(rows),'source_sha256':H(source),'release_claimed':False});print('CLAUDE_BATCH_PASS',ordinal,len(batches),receipt.get('id'),len(translated),flush=True)
           assert [r['id'] for r in results]==[r['id'] for r in rows]
           atomic(ROOT/'translation_complete.json',{'state':'CLAUDE_TRANSLATION_COMPLETE_AI_REVIEW_AND_EPUB_PRODUCTION_PENDING','rank':35,'source_sha256':H(source),'rows':results,'source_rows':len(rows),'release_claimed':False});print('CLAUDE_TRANSLATION_COMPLETE',len(results),flush=True)
          if __name__=='__main__':main()
          PY
      - name: Preserve source, Claude receipts and paragraph-aligned checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru035-claude-translation
          path: staging/ru035-claude/
          if-no-files-found: error
          retention-days: 14
