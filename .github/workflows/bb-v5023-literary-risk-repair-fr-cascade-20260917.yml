name: BB v5.0.23 French literary-risk repair cascade 20260917

on:
  push:
    paths:
      - ".github/workflows/bb-v5023-literary-risk-repair-fr-cascade-20260917.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bb-v5023-literary-risk-repair-fr-cascade-20260917
  cancel-in-progress: false

jobs:
  repair-fr:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Marian runtime
        run: |
          python -m pip install --quiet 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers==4.56.2' 'sentencepiece==0.2.1' 'sacremoses==0.1.1'

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bb-v5023-marian-fr-en-it-transformers-4.56.2-v1

      - name: Download immutable alignment artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_IDS: "10408791146 10407854972 10409160124 10408980745 10416170390 10407539642"
        run: |
          mkdir -p inputs existing-corrections
          for id in $ARTIFACT_IDS; do
            mkdir -p "inputs/$id"
            curl --fail --location --retry 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip" \
              -o "inputs/$id.zip"
            unzip -q "inputs/$id.zip" -d "inputs/$id"
          done

      - name: Repair evidenced high-risk units
        run: >-
          python scripts/bb_literary_risk_repair_v5023.py
          --inputs inputs
          --fallback inputs-v5023/fallback-candidates.json.gz.b64
          --existing-corrections existing-corrections
          --language fr
          --ranks "070,074,075,078,079,081,082"
          --out dist/fr

      - name: Upload correction ledger and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-v5023-literary-risk-repair-fr-cascade-20260917
          path: dist/fr
          if-no-files-found: error
          retention-days: 30
