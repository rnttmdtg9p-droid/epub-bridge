name: BB rank 21 French to Russian translation only
on:
  push:
    branches: [bb-rank21-translation-20261011]
    paths: ['.github/workflows/bb-ru21-deepl-20261011.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bb-rank21-translation-20261011
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'lxml==6.0.2'
      - name: Translate frozen French source with existing DeepL secret
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib,time,datetime
          from pathlib import Path
          from lxml import html,etree as E
          H=lambda b:hashlib.sha256(b).hexdigest()
          out=Path('results/ru21-deepl');out.mkdir(parents=True,exist_ok=True)
          manifest={'rank':21,'master':'5.0.68','source_language':'FR','target_language':'RU','engine':'DeepL quality_optimized','state':'PREPARING','units':{},'full_human_literary_review':'NOT_PERFORMED','release_ready':False,'started_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          def save():
              tmp=out/'manifest.tmp';tmp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2));tmp.replace(out/'manifest.json')
          save()
          key=os.environ.get('DEEPL_AUTH_KEY','').strip()
          if not key:
              manifest.update(state='BLOCKED_AUTH',reason='MISSING_DEEPL_AUTH_KEY');save();raise SystemExit(2)
          host='https://api-free.deepl.com' if key.endswith(':fx') else 'https://api.deepl.com'
          def call(path,payload=None):
              for attempt in range(4):
                  req=urllib.request.Request(host+path,data=json.dumps(payload).encode() if payload is not None else None,headers={'Authorization':'DeepL-Auth-Key '+key,'Content-Type':'application/json'})
                  try:
                      with urllib.request.urlopen(req,timeout=120) as r:
                          return json.load(r),r.headers.get('x-trace-id') or r.headers.get('x-request-id')
                  except urllib.error.HTTPError as e:
                      if e.code in (429,500,502,503,504) and attempt<3:
                          time.sleep(3*(attempt+1));continue
                      raise RuntimeError('DEEPL_HTTP_'+str(e.code)) from None
                  except Exception as e:
                      raise RuntimeError('DEEPL_NETWORK_'+type(e).__name__) from None
          expected=[{'id': 'pref01', 'sha256': '42da59e1a95eee0a795ba84490b9e5b4f8748e79b99a8de5e29d5f8c12087a32', 'blocks': 14}, {'id': 'chap01', 'sha256': '8f2e640c82b7cc88a15ce96d275a3bbfbd4cf8031d5ce1aef523c9758bfdd703', 'blocks': 128}, {'id': 'chap02', 'sha256': '37dde8ecb0877ef15b3c25a94b4b54bbc417329ab1479b4cc8b65862c0271702', 'blocks': 62}, {'id': 'chap03', 'sha256': '8a59fbf0c54e3777ee9603ba03a9c210e13b75135599f074bc3d6f474d69ca8b', 'blocks': 98}, {'id': 'chap04', 'sha256': 'b7374359913a3808d8016bf959a1e45ca56fb705d5aab7661d32e430f6cfd292', 'blocks': 85}, {'id': 'chap05', 'sha256': '0a3704f8a42790e2951857b748528d229b24056ce55ca81cb3a619eb29b2a679', 'blocks': 127}, {'id': 'chap06', 'sha256': '8dad91db810df5f36df8ad0b95bc9337e7ac574f4f898073bf1e6a2c674c394e', 'blocks': 197}, {'id': 'chap07', 'sha256': '40b19e98f8b5fab162cfb1e29bea21c0e987eb74c44cf3e4e235fedc657887f9', 'blocks': 46}, {'id': 'chap08', 'sha256': 'fa22caac4219d63d28efa4f05d1b96a84315971f2967897e497a811408d76486', 'blocks': 130}, {'id': 'chap09', 'sha256': '2407242b0d41a3dd03e3fc369f2b42eb1196decc6ebe27d766bc0426c8b6d692', 'blocks': 121}, {'id': 'chap10', 'sha256': '028e13cac1691eeb8121b65690dff68cc66e385d9cf98d5c30622380d3b81558', 'blocks': 133}, {'id': 'chap11', 'sha256': '555122a944d993847dee55fdbb2425f2e046fdbe246aaa957543e29d34be7784', 'blocks': 234}, {'id': 'chap12', 'sha256': 'd30f5f61fa41ce9d1f221eb93b5aa1f88e5cfc514f89122ea9102d307446be87', 'blocks': 72}, {'id': 'chap13', 'sha256': 'dd5e60599be307de1753f53931d78cb1a8813d9288e53458bdf8963e7b87e8bb', 'blocks': 119}, {'id': 'chap14', 'sha256': 'f5d986bedd0734965ad25fa35a7f374c32b73ff39507a6fc2c9e99ee4b11ba79', 'blocks': 196}, {'id': 'chap15', 'sha256': 'd0b92b38b26f088c5a9720f9017048391be5439b8ba7eef231ddbf02d15eade0', 'blocks': 94}, {'id': 'chap16', 'sha256': '9bc85e5e9b86132cb5789725ab26371dce730f2b6c7dc741f8b26e421cff6294', 'blocks': 149}, {'id': 'chap17', 'sha256': '13aa4f69782f4888a0c46b33be091f596edd58a405df7f1e7e2add0d41be927c', 'bloc