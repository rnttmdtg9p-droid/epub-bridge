name: BB Russian43 final strictly concise body grounded navigation source comparisons
on:
  push:
    paths: ['.github/workflows/bb-ru43-navigation-final.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Wait for actual complete translation then derive and independently review every navigation label
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 scripts/bb_ru43_navigation_final.py
      - name: Preserve actual inputs model exchanges source anchors and comparison records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru43-final-body-grounded-navigation-v5070
          path: results/ru43-navigation-final/
          retention-days: 90
          if-no-files-found: error

# Resume actual verifiedunit4; exact Unicodecharacter counts in strict retries.
