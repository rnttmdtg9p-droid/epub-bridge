name: BB Anna Karenina Sytin source 20260918
on:
  push:
    paths: ['.github/workflows/bb-anna-sytin-source-20260918.yml']
permissions:
  contents: read
jobs:
  fetch-sytin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download OCR context around the 21 Sytin plates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/word-coords
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          plates='15 39 51 75 87 99 113 137 171 195 211 223 247 263 299 319 339 359 371 383 411'
          for plate in $plates; do
            seq $((plate-3)) $((plate+3))
          done | sort -n -u > source/pages.txt
          cat source/pages.txt | xargs -P 6 -I{} bash -c '
            page="$1"
            ua="$2"
            out=$(printf "source/word-coords/%03d.json" "$page")
            curl -A "$ua" -L --fail --silent --show-error --retry 4 --retry-all-errors --max-time 120               "https://viewer.rsl.ru/api/v1/document/rsl01004182390/page/$page/word-coords"               -o "$out"
          ' _ {} "$UA"
          python - <<'PY'
          from pathlib import Path
          import json, csv
          expected=[int(x) for x in Path("source/pages.txt").read_text().split()]
          rows=[]
          for page in expected:
              p=Path(f"source/word-coords/{page:03d}.json")
              data=json.loads(p.read_text(encoding="utf-8"))
              text=" ".join(item.get("text","") for item in data)
              rows.append([page,len(data),text])
          with open("source/ocr-index.csv","w",newline="",encoding="utf-8") as f:
              w=csv.writer(f); w.writerow(["viewer_page","word_count","text"]); w.writerows(rows)
          PY
          sha256sum source/pages.txt source/ocr-index.csv > source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb-anna-sytin-ocr-context-20260918
          path: source
          retention-days: 14
