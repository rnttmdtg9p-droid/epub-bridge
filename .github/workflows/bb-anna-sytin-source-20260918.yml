name: BB Anna Karenina Sytin source 20260918
on:
  push:
    paths: ['.github/workflows/bb-anna-sytin-source-20260918.yml']
permissions:
  contents: read
jobs:
  fetch-sytin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect RSL viewer application
        shell: bash
        run: |
          set -u
          mkdir -p source/js
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          for f in app.0f697f0d.js pdfModule.2b47014e.js epubModule.585aa71d.js chunk-vendors.bcbb31f1.js; do
            curl -A "$UA" -L --fail --retry 2 --max-time 180 "https://viewer.rsl.ru/js/$f" -o "source/js/$f" || true
          done
          grep -aEo 'https?[^"[:space:]]+|/[A-Za-z0-9_./?&=%{}:-]*(api|document|page|image|tile|manifest|content|download)[A-Za-z0-9_./?&=%{}:-]*' source/js/*.js | sort -u > source/ENDPOINT_HITS.txt || true
          grep -aEo '.{0,180}(rsl01004182390|documentId|docId|pageCount|pagesCount|pageUrl|imageUrl|manifest|tile).{0,260}' source/js/*.js > source/CONTEXT_HITS.txt || true
          find source -type f -size 0 -delete
          file source/js/* > source/FILE_TYPES.txt 2>&1 || true
          sha256sum $(find source -type f | sort) > source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb-anna-sytin-viewer-js-20260918
          path: source
          retention-days: 14
