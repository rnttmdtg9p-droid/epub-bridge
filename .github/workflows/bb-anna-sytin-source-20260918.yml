name: BB Anna Karenina Sytin source 20260918
on:
  push:
    paths: ['.github/workflows/bb-anna-sytin-source-20260918.yml']
permissions:
  contents: read
jobs:
  fetch-sytin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe RSL viewer API
        shell: bash
        run: |
          set -u
          mkdir -p source
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          for id in rsl01004182390 01004182390; do
            curl -A "$UA" -L --retry 1 --max-time 120 -D "source/info-$id.headers" "https://viewer.rsl.ru/api/v1/document/$id/info" -o "source/info-$id.body" || true
            for suffix in '' /image /preview /file /full; do
              tag=$(printf '%s' "$suffix" | tr '/' '_' | sed 's/^$/_root/')
              curl -A "$UA" -L --retry 1 --max-time 120 -D "source/page-$id-$tag.headers" "https://viewer.rsl.ru/api/v1/document/$id/page/1$suffix" -o "source/page-$id-$tag.body" || true
            done
          done
          find source -type f -size 0 -delete
          file source/* > source/FILE_TYPES.txt 2>&1 || true
          sha256sum $(find source -type f | sort) > source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb-anna-sytin-viewer-api-20260918
          path: source
          retention-days: 14
