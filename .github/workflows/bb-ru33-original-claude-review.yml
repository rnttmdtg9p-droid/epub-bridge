name: Rank 33 French original Claude translation then independent literary review (draft only)
on:
  push:
    branches:
      - bb-ru33-french-claude-independent-review-20261105
    paths:
      - '.github/workflows/bb-ru33-original-claude-review.yml'
      - 'scripts/ru33_claude_translate_review.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translate-review:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Original French to Claude Russian; independent OpenAI literary audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5-5
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/ru33_claude_translate_review.py
      - name: Preserve draft translation and review, including partial checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru33-claude-french-original-draft-and-independent-review
          path: results/ru33-french-claude-20261105/
          if-no-files-found: warn
          retention-days: 90
