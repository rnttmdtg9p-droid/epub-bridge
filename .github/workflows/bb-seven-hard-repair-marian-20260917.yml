name: BB seven source-bound hard repair 20260917

on:
  push:
    paths:
      - ".github/workflows/bb-seven-hard-repair-marian-20260917.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bb-seven-source-bound-hard-repair-20260917
  cancel-in-progress: true

jobs:
  repair:
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: en
            ranks: "043,049,055"
            artifacts: "10433572596 10432619947 10468713475"
          - language: ru
            ranks: "061,063,064"
            artifacts: "10468694881 10435059960 10469221277"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Marian runtime
        run: |
          python -m pip install --quiet 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers==4.56.2' 'sentencepiece==0.2.1' 'sacremoses==0.1.1'
      - name: Restore language model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bb-targeted-marian-${{ matrix.language }}-it-transformers-4.56.2-v1
      - name: Download immutable source/target alignment artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_IDS: ${{ matrix.artifacts }}
        run: |
          mkdir -p inputs
          for id in $ARTIFACT_IDS; do
            mkdir -p "inputs/$id"
            curl --fail --location --retry 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip" \
              -o "inputs/$id.zip"
            unzip -q "inputs/$id.zip" -d "inputs/$id"
          done
      - name: Replace only source-bound hard-fault units
        run: >-
          python scripts/bb_targeted_marian_hard_repair.py
          --inputs inputs
          --out "dist/${{ matrix.language }}"
          --language "${{ matrix.language }}"
          --ranks "${{ matrix.ranks }}"
      - name: Upload correction ledger and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-seven-hard-repair-${{ matrix.language }}-20260917
          path: dist
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: repair
    if: always() && needs.repair.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bb-seven-hard-repair-*-20260917
          path: corrections
          merge-multiple: true
      - name: Merge immutable correction ledgers
        run: >-
          python scripts/bb_targeted_marian_hard_repair.py
          --mode merge
          --inputs corrections
          --out merged
      - uses: actions/upload-artifact@v4
        with:
          name: bb-seven-targeted-marian-corrections-20260917
          path: merged
          if-no-files-found: error
          retention-days: 30
