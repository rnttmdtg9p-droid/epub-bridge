name: Recover Gogol Russian originals
on:
  push:
    paths:
      - '.github/workflows/bb-ru24-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve public-domain originals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,urllib.parse,json,hashlib
          root=Path('results/ru24-source');root.mkdir(parents=True,exist_ok=True)
          records=[]
          for rank,title in [(24,'Шинель (Гоголь)/ПСС 1938 (СО)')]:
            urls=['https://ru.wikisource.org/w/api.php?'+urllib.parse.urlencode({'action':'parse','page':title,'prop':'text|revid','format':'json'}),'https://ru.wikisource.org/wiki/'+urllib.parse.quote(title.replace(' ','_'))]
            for i,url in enumerate(urls):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'BBClassicsProduction/1.0 (public-domain ebook research)'})
                raw=urllib.request.urlopen(req,timeout=60).read()
                if i==0:
                  data=json.loads(raw);text=data['parse']['text']['*'];revision=data['parse']['revid']
                else:text=raw.decode();revision=None
                (root/f'{rank:03}.html').write_text(text)
                records.append({'rank':rank,'url':url,'revision':revision,'sha256':hashlib.sha256(text.encode()).hexdigest(),'status':'RECOVERED'})
                break
              except Exception as e:
                records.append({'rank':rank,'url':url,'status':'FAILED','error':str(e)})
          (root/'ledger.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          print([(x['rank'],x['status']) for x in records])
          PY
      - name: Save source checkpoint
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ru24-source/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save recovered public-domain Gogol originals"
          git pull --rebase origin main
          git push origin HEAD:main
