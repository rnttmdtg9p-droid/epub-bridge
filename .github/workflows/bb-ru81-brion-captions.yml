name: BB Russian rank81 Brion captions initial Claude translation
on:
  push:
    paths: ['.github/workflows/bb-ru81-brion-captions.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bb-russian-sequential-rank81-brion-captions
  cancel-in-progress: false
jobs:
  initial-translation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure provenance checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -m py_compile scripts/bb_ru81_brion_captions.py
      - name: Initial translation only; independent review remains foreground
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 scripts/bb_ru81_brion_captions.py
      - name: Preserve raw provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru81-brion-captions-20261029
          path: results/ru81-brion-captions-20261029/
          retention-days: 90
          if-no-files-found: warn
