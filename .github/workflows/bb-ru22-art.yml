name: BB Russian 22 illustration alignment
on:
  push:
    paths:
      - '.github/workflows/bb-ru22-art.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install lxml scikit-learn
      - name: Match historical image anchors to French source
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        run: python3 scripts/bb_ru22_align_art.py
      - name: Save placement checkpoint
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ru22-art/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save rank22 historical image alignment"
          git pull --rebase origin main
          git push origin HEAD:main
