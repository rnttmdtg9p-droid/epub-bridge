name: BB Mastino Marian English-Italian probe 20260917

on:
  push:
    paths:
      - ".github/workflows/bb-mastino-decoder-probe-20260916.yml"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Marian runtime
        run: |
          python -m pip install --quiet 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers==4.56.2' 'sentencepiece==0.2.1' 'sacremoses==0.1.1'
      - name: Download exact Mastino shard
        uses: actions/download-artifact@v4
        with:
          name: bb-final3-055-20260916-repaired-shard-055-0006
          path: probe-input
          repository: rnttmdtg9p-droid/epub-bridge
          run-id: 35128754290
          github-token: ${{ github.token }}
      - name: Translate exact frozen source samples
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          import torch
          from transformers import MarianMTModel, MarianTokenizer

          records = [
              json.loads(line)
              for line in next(Path("probe-input").rglob("*_alignment.jsonl")).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ][:16]
          sources = ["I love pizza!"] + [record["source"] for record in records]
          model_id = "Helsinki-NLP/opus-mt-en-it"
          tokenizer = MarianTokenizer.from_pretrained(model_id)
          model = MarianMTModel.from_pretrained(model_id)
          model.eval()
          encoded = tokenizer(
              sources,
              return_tensors="pt",
              padding=True,
              truncation=True,
              max_length=256,
          )
          with torch.inference_mode():
              generated = model.generate(
                  **encoded,
                  num_beams=4,
                  max_new_tokens=256,
                  no_repeat_ngram_size=3,
                  repetition_penalty=1.1,
                  early_stopping=True,
              )
          translations = tokenizer.batch_decode(generated, skip_special_tokens=True)
          italian_markers = re.compile(r"\b(?:il|lo|la|i|gli|le|un|uno|una|di|del|della|che|non|era|aveva|con|per|nel|nella|suo|sua)\b", re.I)
          rows = []
          for source, target in zip(sources, translations):
              rows.append({
                  "source": source,
                  "translation": target,
                  "ratio": len(target) / max(1, len(source)),
                  "italian_marker_count": len(italian_markers.findall(target)),
              })
          aggregate_ratio = sum(len(row["translation"]) for row in rows) / sum(len(row["source"]) for row in rows)
          bad_ratio_count = sum(row["ratio"] < 0.55 or row["ratio"] > 1.65 for row in rows)
          zero_italian_marker_count = sum(row["italian_marker_count"] == 0 for row in rows[1:])
          report = {
              "status": "PASS" if 0.55 <= aggregate_ratio <= 1.65 and bad_ratio_count <= 2 and zero_italian_marker_count == 0 else "FAIL",
              "model": model_id,
              "torch": torch.__version__,
              "aggregate_ratio": aggregate_ratio,
              "bad_ratio_count": bad_ratio_count,
              "zero_italian_marker_count": zero_italian_marker_count,
              "translations": rows,
          }
          print(json.dumps(report, ensure_ascii=False))
          if report["status"] != "PASS":
              raise SystemExit(1)
          PY
