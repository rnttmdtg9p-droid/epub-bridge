name: BB Mastino MADLAD decoder probe 20260916

on:
  push:
    paths:
      - ".github/workflows/bb-mastino-decoder-probe-20260916.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install exact translation runtime
        run: python -m pip install --quiet 'ctranslate2==4.6.0' 'sentencepiece==0.2.1' 'huggingface_hub==0.34.4'
      - name: Restore MADLAD runtime cache
        uses: actions/cache@v4
        with:
          path: |
            madlad_ct2
            madlad_tokenizer
          key: bb-madlad400-3b-mt-ct2-int8-v1
      - name: Compare deterministic decoder settings
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import ctranslate2
          import sentencepiece as spm
          from huggingface_hub import hf_hub_download, snapshot_download

          model_dir = snapshot_download(
              repo_id="Heng666/madlad400-3b-mt-ct2-int8",
              local_dir="madlad_ct2",
              local_files_only=Path("madlad_ct2/model.bin").exists(),
          )
          tokenizer_file = hf_hub_download(
              repo_id="google/madlad400-3b-mt",
              filename="spiece.model",
              local_dir="madlad_tokenizer",
              local_files_only=Path("madlad_tokenizer/spiece.model").exists(),
          )
          processor = spm.SentencePieceProcessor(model_file=tokenizer_file)
          translator = ctranslate2.Translator(
              model_dir, device="cpu", compute_type="int8",
              inter_threads=1, intra_threads=4,
          )

          samples = [
              "He chanced to be at his hall door.",
              "The idea of some ghastly presence constantly haunted him, and on more than one occasion he has asked me whether I had on my medical journeys at night ever seen any strange creature or heard the baying of a hound.",
              "I whisked round and had just time to catch a glimpse of something which I took to be a large black calf passing at the head of the drive.",
              "I mention this small episode because it assumes some importance in view of the tragedy which followed, but I was convinced at the time that the matter was entirely trivial and that his excitement had no justification.",
          ]
          settings = [
              ("current", dict(beam_size=1)),
              ("model_card", dict(beam_size=1, no_repeat_ngram_size=1, repetition_penalty=2.0)),
              ("balanced_beam2", dict(beam_size=2, no_repeat_ngram_size=3, repetition_penalty=1.3)),
              ("balanced_beam4", dict(beam_size=4, no_repeat_ngram_size=3, repetition_penalty=1.2)),
              ("strong_beam4", dict(beam_size=4, no_repeat_ngram_size=2, repetition_penalty=1.5)),
          ]
          encoded = [processor.encode("<2it> " + source, out_type=str) for source in samples]
          print(json.dumps({
              "tokenizer_sha256": hashlib.sha256(Path(tokenizer_file).read_bytes()).hexdigest(),
              "prefix_tokens": encoded[0][:6],
          }, ensure_ascii=False))
          for label, options in settings:
              outputs = translator.translate_batch(
                  encoded,
                  max_decoding_length=256,
                  batch_type="tokens",
                  max_batch_size=1024,
                  **options,
              )
              print(json.dumps({
                  "setting": label,
                  "translations": [
                      processor.decode(result.hypotheses[0]).strip()
                      for result in outputs
                  ],
              }, ensure_ascii=False))
          PY
