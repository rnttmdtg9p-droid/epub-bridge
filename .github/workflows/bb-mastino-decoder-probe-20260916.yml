name: BB Mastino tokenizer integrity probe 20260917

on:
  push:
    paths:
      - ".github/workflows/bb-mastino-decoder-probe-20260916.yml"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install exact translation runtime
        run: python -m pip install --quiet 'ctranslate2==4.6.0' 'sentencepiece==0.2.1' 'huggingface_hub==0.34.4'
      - name: Restore MADLAD runtime cache
        uses: actions/cache@v4
        with:
          path: |
            madlad_ct2
            madlad_tokenizer
          key: bb-madlad400-3b-mt-ct2-int8-v1
      - name: Download exact Mastino shard
        uses: actions/download-artifact@v4
        with:
          name: bb-final3-055-20260916-repaired-shard-055-0006
          path: probe-input
          repository: rnttmdtg9p-droid/epub-bridge
          run-id: 35128754290
          github-token: ${{ github.token }}
      - name: Compare target-prefix tokenization variants
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import ctranslate2
          import sentencepiece as spm
          from huggingface_hub import hf_hub_download, snapshot_download

          runtime_repo = "Heng666/madlad400-3b-mt-ct2-int8"
          records = [
              json.loads(line)
              for line in next(Path("probe-input").rglob("*_alignment.jsonl")).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ][:8]
          sources = ["I love pizza!"] + [record["source"] for record in records]
          model_dir = snapshot_download(
              repo_id=runtime_repo,
              local_dir="madlad_ct2",
              local_files_only=Path("madlad_ct2/model.bin").exists(),
          )
          google_tokenizer = hf_hub_download(
              repo_id="google/madlad400-3b-mt",
              filename="spiece.model",
              local_dir="madlad_tokenizer",
              local_files_only=Path("madlad_tokenizer/spiece.model").exists(),
          )
          translator = ctranslate2.Translator(
              model_dir, device="cpu", compute_type="int8",
              inter_threads=1, intra_threads=4,
          )

          print(json.dumps({
              "google_tokenizer_sha256": hashlib.sha256(Path(google_tokenizer).read_bytes()).hexdigest(),
              "runtime_files": sorted(str(path.relative_to(model_dir)) for path in Path(model_dir).rglob("*") if path.is_file()),
          }))

          for label, tokenizer_path, strip_dummy in [
              ("google_tokenizer_current", google_tokenizer, False),
              ("google_tokenizer_strip_dummy_prefix", google_tokenizer, True),
          ]:
              processor = spm.SentencePieceProcessor(model_file=tokenizer_path)
              encoded = [processor.encode("<2it> " + source, out_type=str) for source in sources]
              if strip_dummy:
                  encoded = [tokens[1:] if len(tokens) > 1 and tokens[0] == "▁" and tokens[1] == "<2it>" else tokens for tokens in encoded]
              outputs = translator.translate_batch(
                  encoded,
                  beam_size=1,
                  no_repeat_ngram_size=1,
                  repetition_penalty=2.0,
                  max_decoding_length=min(256, max(48, max(map(len, encoded)) * 2)),
                  batch_type="tokens",
                  max_batch_size=1024,
              )
              translations = [processor.decode(result.hypotheses[0]).strip() for result in outputs]
              print(json.dumps({
                  "setting": label,
                  "prefix_tokens": encoded[0][:6],
                  "aggregate_ratio": sum(map(len, translations)) / sum(map(len, sources)),
                  "translations": [
                      {"source": source, "translation": target, "ratio": len(target) / max(1, len(source))}
                      for source, target in zip(sources, translations)
                  ],
              }, ensure_ascii=False))
          PY
