          def get(url):
           for n in range(3):
            try:
             r=requests.get(url,timeout=50,headers={'User-Agent':'BoundaryBayResearch/1.0 (historical public domain books)'});r.raise_for_status();return r.json()
            except Exception as e:
             if n==2:return {'error':str(e)}
             time.sleep(10*(n+1))
          def run(x):
           key,title,creator,orig=x
           q='"'+orig+'" '+creator.split()[-1]+' illustration'
           u='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(dict(action='query',format='json',list='search',srsearch=q,srnamespace='6|14',srlimit=50))
           d={'key':key,'routes':[{'route':'commons_author_disambiguated','query':q,'url':u,'response':get(u)}]}
           q='title:("'+orig+'") AND mediatype:texts AND year:[1500 TO 1930]'
           u='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode({'q':q,'output':'json','rows':50,'fl[]':['identifier','title','creator','date','description']},doseq=True)
           d['routes'].append({'route':'archive_original_title_historical_editions','query':q,'url':u,'response':get(u)})
           ROOT.joinpath(key+'.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print(key,flush=True);time.sleep(4)
          for x in ROSTER:run(x)
