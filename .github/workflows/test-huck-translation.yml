name: Test Italian translation batching

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-huck-translation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Argos and translate sample
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet argostranslate
          python3 - <<'PY'
          import json
          import argostranslate.package
          import argostranslate.translate
          argostranslate.package.update_package_index()
          packages = argostranslate.package.get_available_packages()
          package = next(p for p in packages if p.from_code == "en" and p.to_code == "it")
          path = package.download()
          argostranslate.package.install_from_path(path)
          src = next(x for x in argostranslate.translate.get_installed_languages() if x.code == "en")
          dst = next(x for x in argostranslate.translate.get_installed_languages() if x.code == "it")
          engine = src.get_translation(dst)
          samples = [
              "You don’t know about me without you have read a book by the name of The Adventures of Tom Sawyer; but that ain’t no matter.",
              "The widow she cried over me, and called me a poor lost lamb, but she never meant no harm by it.",
              "Pretty soon I wanted to smoke, and asked the widow to let me. But she wouldn’t."
          ]
          result = {"package":str(package),"parts":[engine.translate(s) for s in samples]}
          open("translation-test.json","w",encoding="utf-8").write(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huck-translation-test
          path: translation-test.json
          retention-days: 2
