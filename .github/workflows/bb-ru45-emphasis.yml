name: BB Russian45 complete source-aligned AI literary review
on:
  push:
    paths: ['.github/workflows/bb-ru45-emphasis.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure durable production checkpoints
        run: |
          git config user.name 'Boundary Bay Production'
          git config user.email 'production@boundarybaypublishing.com'
      - name: Review all2530 retained source rows and12 story names and compare all corrections
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 scripts/bb_ru45_emphasis.py
      - name: Preserve actual review exchanges and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru45-emphasis-actual-review-v5070
          path: results/ru45-emphasis/
          retention-days: 90
          if-no-files-found: error
